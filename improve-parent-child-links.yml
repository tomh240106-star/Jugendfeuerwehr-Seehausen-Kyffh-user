name: Improve Parent Child Links

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve-parent-child-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_parent_child.py
          python3 /tmp/patch_parent_child.py

      - name: Format
        run: dart format lib/screens/members_screen.dart

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Build web
        run: >
          flutter build web
          --release
          --base-href "/Jugendfeuerwehr-Seehausen-Kyffh-user/"
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Verify
        run: |
          grep -q "Verknüpfung wurde entfernt" lib/screens/members_screen.dart
          grep -q "Eltern-Kind-Verknüpfung wurde gespeichert" lib/screens/members_screen.dart
          grep -q "_sortedLinks" lib/screens/members_screen.dart
          grep -q "_changed = true" lib/screens/members_screen.dart

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/members_screen.dart

          if git diff --cached --quiet; then
            echo "Keine Änderungen nötig."
            exit 0
          fi

          git commit -m "Improve parent child link management"
          git push origin main
