name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "ios/**"
      - "pubspec.yaml"
      - ".github/workflows/ios-build.yml"

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create iOS project if missing
        run: |
          set -e
          if [ ! -d ios ]; then
            flutter create . \
              --platforms=ios \
              --org de.jfseehausen \
              --project-name jf_seehausen_kyffhaeuser
          fi

      - name: Set iOS bundle identifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = p.read_text()
          text = text.replace(
              "com.example.jfSeehausenKyffhaeuser",
              "de.jfseehausen.kyffhaeuser"
          )
          text = text.replace(
              "de.jfseehausen.jfSeehausenKyffhaeuser",
              "de.jfseehausen.kyffhaeuser"
          )
          p.write_text(text)
          PY

      - name: Restore Firebase iOS config
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -e
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "FEHLER: Secret GOOGLE_SERVICE_INFO_PLIST_BASE64 fehlt."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          test -s ios/Runner/GoogleService-Info.plist

      - name: Add iOS alarm sound
        run: |
          set -e
          if [ -f android/app/src/main/res/raw/jf_alarm.wav ]; then
            cp android/app/src/main/res/raw/jf_alarm.wav ios/Runner/jf_alarm.wav
          else
            echo "FEHLER: Android Alarmdatei jf_alarm.wav fehlt."
            exit 1
          fi

      - name: Configure iOS notification capabilities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          info = Path("ios/Runner/Info.plist")
          with info.open("rb") as f:
              data = plistlib.load(f)

          data["FirebaseAppDelegateProxyEnabled"] = True

          with info.open("wb") as f:
              plistlib.dump(data, f)

          ent = Path("ios/Runner/Runner.entitlements")
          ent.write_text("""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>development</string>
          </dict>
          </plist>
          """)
          PY

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Analyze
        run: flutter analyze

      - name: Build iOS without codesigning
        run: >
          flutter build ios
          --release
          --no-codesign
          --target=lib/main.dart
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Package unsigned app
        run: |
          cd build/ios/iphoneos
          zip -r jf-seehausen-ios-unsigned.zip Runner.app

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: jf-seehausen-ios-unsigned
          path: build/ios/iphoneos/jf-seehausen-ios-unsigned.zip
          if-no-files-found: error
