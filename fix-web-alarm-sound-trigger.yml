name: Fix Web Alarm Sound Trigger

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-web-alarm-sound-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch web alarm trigger
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("web/index.html")
          text = path.read_text(encoding="utf-8")

          old_request = '''    window.jfWebPushRequestToken = async function () {
              if (!("Notification" in window)) return "";

              const permission = await Notification.requestPermission();
          '''

          new_request = '''    window.jfWebPushRequestToken = async function () {
              if (!("Notification" in window)) return "";

              window.jfWebAlarmPrime();

              const permission = await Notification.requestPermission();
          '''

          if "window.jfWebAlarmPrime();" not in text:
              if old_request not in text:
                  raise SystemExit("Push-Aktivierungsblock wurde nicht gefunden.")
              text = text.replace(old_request, new_request, 1)

          old_handler = '''    jfMessaging.onMessage((payload) => {
              const data = payload?.data || {};
              if ((data.source || "") !== "jf_alarm") return;

              const title =
          '''

          new_handler = '''    jfMessaging.onMessage((payload) => {
              const data = payload?.data || {};
              const source = data.source || "";

              if (source === "jf_alarm_cancel") {
                window.jfWebAlarmStop();
                return;
              }

              if (source !== "jf_alarm") return;

              window.jfWebAlarmStart(
                data.alarm_id || "active",
                data.title || "JUGENDFEUERWEHR-ALARM",
                data.body || "Alarm öffnen und Rückmeldung geben."
              );

              const title =
          '''

          if 'window.jfWebAlarmStart(\n        data.alarm_id || "active"' not in text:
              if old_handler not in text:
                  raise SystemExit("Foreground-Push-Handler wurde nicht gefunden.")
              text = text.replace(old_handler, new_handler, 1)

          path.write_text(text, encoding="utf-8")
          print("Web-Alarm-Audiotrigger erfolgreich angepasst.")
          PY

      - name: Verify source patch
        run: |
          set -e
          grep -q "window.jfWebAlarmPrime();" web/index.html
          grep -q "window.jfWebAlarmStart(" web/index.html
          grep -q 'source === "jf_alarm_cancel"' web/index.html

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Build web
        run: >
          flutter build web
          --release
          --base-href "/Jugendfeuerwehr-Seehausen-Kyffh-user/"
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Verify built web
        run: |
          set -e
          test -f build/web/jf_alarm.wav
          grep -q "window.jfWebAlarmPrime();" build/web/index.html
          grep -q "window.jfWebAlarmStart(" build/web/index.html
          grep -q 'source === "jf_alarm_cancel"' build/web/index.html

      - name: Commit
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add web/index.html

          if git diff --cached --quiet; then
            echo "Fix bereits vorhanden."
            exit 0
          fi

          git commit -m "Fix web alarm sound trigger"
          git push origin main

      - name: Summary
        run: |
          echo "### Web-Alarmton Trigger repariert" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Audio wird beim Aktivieren der Benachrichtigungen freigeschaltet" >> "$GITHUB_STEP_SUMMARY"
          echo "- Eingehender Foreground-Alarm startet jf_alarm.wav" >> "$GITHUB_STEP_SUMMARY"
          echo "- Alarmende stoppt den Web-Alarmton" >> "$GITHUB_STEP_SUMMARY"
