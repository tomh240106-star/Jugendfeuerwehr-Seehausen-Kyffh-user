name: Add Parent Area

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-parent-area:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply parent area
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/add_parent_area.py
          python3 /tmp/add_parent_area.py

      - name: Format
        run: dart format lib/screens/home_shell.dart

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Build web
        run: >
          flutter build web
          --release
          --base-href "/Jugendfeuerwehr-Seehausen-Kyffh-user/"
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Verify
        run: |
          grep -q "class _ParentAreaScreen" lib/screens/home_shell.dart
          grep -q "title: 'Meine Kinder'" lib/screens/home_shell.dart
          grep -q "Nächste Termine" lib/screens/home_shell.dart

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_shell.dart

          if git diff --cached --quiet; then
            echo "Keine Änderungen nötig."
            exit 0
          fi

          git commit -m "Add parent area for linked children"
          git push origin main
