name: Link Training Units To Events V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add linked training event reminders
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          reminder_helpers = base64.b64decode("").decode()
          details_link_block = base64.b64decode("").decode()
          editor_helpers = base64.b64decode("").decode()
          dropdown_block = base64.b64decode("").decode()

          path = Path("lib/screens/training_plans_screen.dart")
          text = path.read_text(encoding="utf-8")

          details_start = text.find("class _TrainingPlanDetailsScreenState")
          plan_editor_start = text.find("class _TrainingPlanEditorState", details_start)
          unit_editor_start = text.find("class _TrainingUnitEditorState", details_start)
          if details_start == -1 or plan_editor_start == -1 or unit_editor_start == -1:
              raise SystemExit("training screen sections not found")

          # Details state fields
          details = text[details_start:plan_editor_start]
          if "bool _eventRemindersEnabled = true;" not in details:
              m = re.search(r"(?m)^  String _unitSearch = '';\\s*$", details)
              if not m:
                  raise SystemExit("unit search state field not found")
              insert = "\n  bool _eventRemindersEnabled = true;\n  int _reminderMinutes = 30;"
              pos = details_start + m.end()
              text = text[:pos] + insert + text[pos:]

          # Details initState
          plan_editor_start = text.find("class _TrainingPlanEditorState", details_start)
          details = text[details_start:plan_editor_start]
          if "_loadReminderSettings();" not in details:
              pattern = r"(void initState\(\) \{\s*super\.initState\(\);\s*)(_loadUnits\(\);)"
              new_details, n = re.subn(
                  pattern,
                  r"\1_loadReminderSettings();\n    \2",
                  details,
                  count=1,
              )
              if n != 1:
                  raise SystemExit("details initState not found")
              text = text[:details_start] + new_details + text[plan_editor_start:]

          # Join event data when loading units
          plan_editor_start = text.find("class _TrainingPlanEditorState", details_start)
          details = text[details_start:plan_editor_start]
          if "events(id,title,starts_at,ends_at,location)" not in details:
              old = ".from('training_units')\n          .select()"
              new = ".from('training_units')\n          .select('*, events(id,title,starts_at,ends_at,location)')"
              if old not in details:
                  raise SystemExit("training units select not found")
              details = details.replace(old, new, 1)
              text = text[:details_start] + details + text[plan_editor_start:]

          # Helper methods
          plan_editor_start = text.find("class _TrainingPlanEditorState", details_start)
          details = text[details_start:plan_editor_start]
          if "Future<void> _loadReminderSettings()" not in details:
              pos_rel = details.find("  Future<void> _loadUnits()")
              if pos_rel == -1:
                  raise SystemExit("loadUnits method not found")
              pos = details_start + pos_rel
              text = text[:pos] + reminder_helpers + text[pos:]

          # Insert linked event + reminder at the beginning of ExpansionTile children.
          plan_editor_start = text.find("class _TrainingPlanEditorState", details_start)
          details = text[details_start:plan_editor_start]
          if "'Erinnerung'," not in details:
              map_pos = details.find("..._filteredUnits.map((unit)")
              if map_pos == -1:
                  raise SystemExit("filtered units map not found")
              children_pos = details.find("                            children: [", map_pos)
              if children_pos == -1:
                  raise SystemExit("unit ExpansionTile children list not found")
              line_end = details.find("\n", children_pos)
              if line_end == -1:
                  raise SystemExit("unit children line ending not found")
              insert_rel = line_end + 1
              details = details[:insert_rel] + details_link_block + details[insert_rel:]
              text = text[:details_start] + details + text[plan_editor_start:]

          # Re-find unit editor because text shifted.
          unit_editor_start = text.find("class _TrainingUnitEditorState")
          if unit_editor_start == -1:
              raise SystemExit("unit editor state not found")
          editor = text[unit_editor_start:]

          # Editor state fields
          if "List<Map<String, dynamic>> _availableEvents" not in editor:
              m = re.search(r"(?m)^  bool _saving = false;\\s*$", editor)
              if not m:
                  raise SystemExit("editor saving field not found")
              insert = (
                  "\n  bool _loadingEvents = true;"
                  "\n  List<Map<String, dynamic>> _availableEvents = [];"
                  "\n  String? _selectedEventId;"
              )
              pos = unit_editor_start + m.end()
              text = text[:pos] + insert + text[pos:]

          # Editor initState: selected link + load events
          unit_editor_start = text.find("class _TrainingUnitEditorState")
          editor = text[unit_editor_start:]
          if "_loadAvailableEvents();" not in editor:
              marker = "(widget.suggestedOrder ?? 0).toString(),\n    );"
              pos_rel = editor.find(marker)
              if pos_rel == -1:
                  raise SystemExit("editor sort order init not found")
              pos = unit_editor_start + pos_rel + len(marker)
              insert = (
                  "\n    _selectedEventId = widget.unit?['event_id']?.toString();"
                  "\n    _loadAvailableEvents();"
              )
              text = text[:pos] + insert + text[pos:]

          # Editor helper methods
          unit_editor_start = text.find("class _TrainingUnitEditorState")
          editor = text[unit_editor_start:]
          if "Future<void> _loadAvailableEvents()" not in editor:
              pos_rel = editor.find("  Future<void> _save()")
              if pos_rel == -1:
                  raise SystemExit("unit editor save method not found")
              pos = unit_editor_start + pos_rel
              text = text[:pos] + editor_helpers + text[pos:]

          # Save event_id with the unit
          unit_editor_start = text.find("class _TrainingUnitEditorState")
          editor = text[unit_editor_start:]
          if "'event_id': _selectedEventId," not in editor:
              marker = "      'training_plan_id': widget.trainingPlanId,"
              pos_rel = editor.find(marker)
              if pos_rel == -1:
                  raise SystemExit("training_plan_id save field not found")
              pos = unit_editor_start + pos_rel + len(marker)
              text = text[:pos] + "\n      'event_id': _selectedEventId," + text[pos:]

          # Dropdown between topic and objectives
          unit_editor_start = text.find("class _TrainingUnitEditorState")
          editor = text[unit_editor_start:]
          if "labelText: 'Mit Termin verknüpfen'" not in editor:
              objective_pos = editor.find("              TextFormField(\n                controller: _objectives,")
              if objective_pos == -1:
                  raise SystemExit("objectives field not found")
              pos = unit_editor_start + objective_pos
              text = text[:pos] + dropdown_block + text[pos:]

          path.write_text(text, encoding="utf-8")

          # Version bump
          pubspec = Path("pubspec.yaml")
          p = pubspec.read_text(encoding="utf-8")
          if "version: 1.0.6+8" in p:
              p = p.replace("version: 1.0.6+8", "version: 1.0.7+9", 1)
          elif "version: 1.0.7+9" not in p:
              raise SystemExit("Expected version 1.0.6+8 not found")
          pubspec.write_text(p, encoding="utf-8")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Format
        run: dart format lib/screens/training_plans_screen.dart

      - name: Analyze
        run: flutter analyze lib/screens/training_plans_screen.dart

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/training_plans_screen.dart pubspec.yaml
          git commit -m "Link training units to events and show reminders"
          git push origin main
