name: Add Member Approval And Removal V4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          approval_code = base64.b64decode("").decode()
          helper_code = base64.b64decode("").decode()
          action_buttons = base64.b64decode("").decode()

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label} not found")
              return text.replace(old, new, 1)

          main = Path("lib/main.dart")
          text = main.read_text(encoding="utf-8")
          if "import 'dart:async';" not in text:
              text = "import 'dart:async';\n\n" + text
          if "return const ApprovalGate();" not in text:
              text = replace_once(
                  text,
                  "        return const HomeShell();",
                  "        return const ApprovalGate();",
                  "AuthGate HomeShell return",
              )
          if "class ApprovalGate extends StatefulWidget" not in text:
              text += approval_code
          main.write_text(text, encoding="utf-8")

          auth = Path("lib/screens/auth_screen.dart")
          text = auth.read_text(encoding="utf-8")
          old_sentence = "Registrierung erfolgreich. Bitte prüfe deine E-Mails, falls eine Bestätigung erforderlich ist."
          new_sentence = "Registrierung erfolgreich. Nach einer eventuell erforderlichen E-Mail-Bestätigung muss dein Konto noch von mindestens einem Ausbilder freigegeben werden."
          if old_sentence in text:
              text = text.replace(old_sentence, new_sentence, 1)
          auth.write_text(text, encoding="utf-8")

          members = Path("lib/screens/members_screen.dart")
          text = members.read_text(encoding="utf-8")

          old_select = ".select('id,first_name,last_name,role,phone,notifications_enabled')"
          new_select = ".select('id,first_name,last_name,role,phone,notifications_enabled,approval_status,approved_at')"
          if old_select in text:
              text = text.replace(old_select, new_select, 1)

          editor_anchor = "  Future<void> _save() async {"
          if "Future<void> _approveAccount()" not in text:
              if editor_anchor not in text:
                  raise SystemExit("Profile editor save anchor not found")
              text = text.replace(editor_anchor, helper_code + editor_anchor, 1)

          save_button = """            SizedBox(
              width: double.infinity,
              child: FilledButton.icon(
                onPressed: _saving ? null : _save,
                icon: const Icon(Icons.save),
                label: const Text('Speichern'),
              ),
            ),"""
          if "Konto freigeben" not in text:
              if save_button not in text:
                  raise SystemExit("Profile editor save button not found")
              text = text.replace(save_button, save_button + action_buttons, 1)

          members.write_text(text, encoding="utf-8")

          pubspec = Path("pubspec.yaml")
          p = pubspec.read_text(encoding="utf-8")
          if "version: 1.0.3+5" in p:
              p = p.replace("version: 1.0.3+5", "version: 1.0.4+6", 1)
          elif "version: 1.0.4+6" not in p:
              raise SystemExit("Expected app version not found")
          pubspec.write_text(p, encoding="utf-8")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Format
        run: dart format lib/main.dart lib/screens/auth_screen.dart lib/screens/members_screen.dart

      - name: Analyze
        run: flutter analyze lib/main.dart lib/screens/auth_screen.dart lib/screens/members_screen.dart

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/screens/auth_screen.dart lib/screens/members_screen.dart pubspec.yaml
          git commit -m "Add member approval and removal"
          git push origin main
