name: Clean More Area

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-more-area:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean more area
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/clean_more.py
          python3 -m py_compile /tmp/clean_more.py
          python3 /tmp/clean_more.py

      - name: Format
        run: dart format lib/screens/home_shell.dart

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Build web
        run: >
          flutter build web
          --release
          --base-href "/Jugendfeuerwehr-Seehausen-Kyffh-user/"
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Verify
        run: |
          grep -q "title: 'Mein Bereich'" lib/screens/home_shell.dart
          grep -q "title: 'Jugendfeuerwehr'" lib/screens/home_shell.dart
          grep -q "title: 'Informationen & Rechtliches'" lib/screens/home_shell.dart
          test "$(grep -c "title: 'Datenschutz'" lib/screens/home_shell.dart)" -eq 1
          ! grep -q "class _LegalTextScreen" lib/screens/home_shell.dart

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_shell.dart

          if git diff --cached --quiet; then
            echo "Keine Änderungen nötig."
            exit 0
          fi

          git commit -m "Clean up more area navigation"
          git push origin main
