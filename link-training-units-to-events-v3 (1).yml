name: Link Training Units To Events V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add linked training event reminders
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          reminder_helpers = base64.b64decode("").decode()
          details_link_block = base64.b64decode("").decode()
          editor_helpers = base64.b64decode("").decode()
          dropdown_block = base64.b64decode("").decode()

          path = Path("lib/screens/training_plans_screen.dart")
          text = path.read_text(encoding="utf-8")

          details_start = text.find("class _TrainingPlanDetailsScreenState")
          plan_editor_start = text.find(
              "class _TrainingPlanEditorState", details_start
          )
          if details_start == -1 or plan_editor_start == -1:
              raise SystemExit("training details section not found")

          # 1) Reminder state.
          details = text[details_start:plan_editor_start]
          if "bool _eventRemindersEnabled = true;" not in details:
              anchor = "  String _unitSearch = '';"
              pos_rel = details.find(anchor)
              if pos_rel == -1:
                  raise SystemExit("unit search field not found")
              pos = details_start + pos_rel + len(anchor)
              text = (
                  text[:pos]
                  + "\n  bool _eventRemindersEnabled = true;"
                  + "\n  int _reminderMinutes = 30;"
                  + text[pos:]
              )

          # 2) Load reminder settings when details open.
          plan_editor_start = text.find(
              "class _TrainingPlanEditorState", details_start
          )
          details = text[details_start:plan_editor_start]
          if "_loadReminderSettings();" not in details:
              old = "    super.initState();\n    _loadUnits();"
              new = (
                  "    super.initState();\n"
                  "    _loadReminderSettings();\n"
                  "    _loadUnits();"
              )
              if old not in details:
                  raise SystemExit("details initState lines not found")
              details = details.replace(old, new, 1)
              text = text[:details_start] + details + text[plan_editor_start:]

          # 3) Join event data to training units.
          plan_editor_start = text.find(
              "class _TrainingPlanEditorState", details_start
          )
          details = text[details_start:plan_editor_start]
          if "events(id,title,starts_at,ends_at,location)" not in details:
              old = ".from('training_units')\n          .select()"
              new = (
                  ".from('training_units')\n"
                  "          .select('*, events(id,title,starts_at,ends_at,location)')"
              )
              if old not in details:
                  raise SystemExit("training unit select not found")
              details = details.replace(old, new, 1)
              text = text[:details_start] + details + text[plan_editor_start:]

          # 4) Helper methods.
          plan_editor_start = text.find(
              "class _TrainingPlanEditorState", details_start
          )
          details = text[details_start:plan_editor_start]
          if "Future<void> _loadReminderSettings()" not in details:
              pos_rel = details.find("  Future<void> _loadUnits()")
              if pos_rel == -1:
                  raise SystemExit("loadUnits method not found")
              pos = details_start + pos_rel
              text = text[:pos] + reminder_helpers + text[pos:]

          # 5) Show linked event + own reminder in each training unit.
          plan_editor_start = text.find(
              "class _TrainingPlanEditorState", details_start
          )
          details = text[details_start:plan_editor_start]
          if "'Erinnerung'," not in details:
              map_rel = details.find("..._filteredUnits.map((unit)")
              if map_rel == -1:
                  raise SystemExit("filtered units map not found")

              children_rel = details.find(
                  "                            children: [", map_rel
              )
              if children_rel == -1:
                  raise SystemExit("ExpansionTile children not found")

              line_end_rel = details.find("\n", children_rel)
              if line_end_rel == -1:
                  raise SystemExit("ExpansionTile children line end not found")

              insert_rel = line_end_rel + 1
              details = (
                  details[:insert_rel]
                  + details_link_block
                  + details[insert_rel:]
              )
              text = text[:details_start] + details + text[plan_editor_start:]

          # 6) Unit editor.
          unit_editor_start = text.find("class _TrainingUnitEditorState")
          if unit_editor_start == -1:
              raise SystemExit("training unit editor not found")
          editor = text[unit_editor_start:]

          if "List<Map<String, dynamic>> _availableEvents" not in editor:
              anchor = "  bool _saving = false;"
              pos_rel = editor.find(anchor)
              if pos_rel == -1:
                  raise SystemExit("unit editor saving field not found")
              pos = unit_editor_start + pos_rel + len(anchor)
              text = (
                  text[:pos]
                  + "\n  bool _loadingEvents = true;"
                  + "\n  List<Map<String, dynamic>> _availableEvents = [];"
                  + "\n  String? _selectedEventId;"
                  + text[pos:]
              )

          # 7) Preserve current event link and load event choices.
          unit_editor_start = text.find("class _TrainingUnitEditorState")
          editor = text[unit_editor_start:]
          if "_loadAvailableEvents();" not in editor:
              anchor = (
                  "    _sortOrder = TextEditingController(\n"
                  "      text: widget.unit?['sort_order']?.toString() ??\n"
                  "          (widget.suggestedOrder ?? 0).toString(),\n"
                  "    );"
              )
              pos_rel = editor.find(anchor)
              if pos_rel == -1:
                  raise SystemExit("unit editor sort-order init not found")
              pos = unit_editor_start + pos_rel + len(anchor)
              text = (
                  text[:pos]
                  + "\n    _selectedEventId = "
                  + "widget.unit?['event_id']?.toString();"
                  + "\n    _loadAvailableEvents();"
                  + text[pos:]
              )

          # 8) Event-list helper methods.
          unit_editor_start = text.find("class _TrainingUnitEditorState")
          editor = text[unit_editor_start:]
          if "Future<void> _loadAvailableEvents()" not in editor:
              pos_rel = editor.find("  Future<void> _save()")
              if pos_rel == -1:
                  raise SystemExit("unit editor save method not found")
              pos = unit_editor_start + pos_rel
              text = text[:pos] + editor_helpers + text[pos:]

          # 9) Save event_id.
          unit_editor_start = text.find("class _TrainingUnitEditorState")
          editor = text[unit_editor_start:]
          if "'event_id': _selectedEventId," not in editor:
              anchor = "      'training_plan_id': widget.trainingPlanId,"
              pos_rel = editor.find(anchor)
              if pos_rel == -1:
                  raise SystemExit("training_plan_id save field not found")
              pos = unit_editor_start + pos_rel + len(anchor)
              text = (
                  text[:pos]
                  + "\n      'event_id': _selectedEventId,"
                  + text[pos:]
              )

          # 10) Dropdown after topic and before learning objectives.
          unit_editor_start = text.find("class _TrainingUnitEditorState")
          editor = text[unit_editor_start:]
          if "labelText: 'Mit Termin verknüpfen'" not in editor:
              anchor = (
                  "              TextFormField(\n"
                  "                controller: _objectives,"
              )
              pos_rel = editor.find(anchor)
              if pos_rel == -1:
                  raise SystemExit("objectives field not found")
              pos = unit_editor_start + pos_rel
              text = text[:pos] + dropdown_block + text[pos:]

          path.write_text(text, encoding="utf-8")

          # 11) Version bump.
          pubspec = Path("pubspec.yaml")
          p = pubspec.read_text(encoding="utf-8")
          if "version: 1.0.6+8" in p:
              p = p.replace("version: 1.0.6+8", "version: 1.0.7+9", 1)
          elif "version: 1.0.7+9" not in p:
              raise SystemExit("Expected version 1.0.6+8 not found")
          pubspec.write_text(p, encoding="utf-8")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Format
        run: dart format lib/screens/training_plans_screen.dart

      - name: Analyze
        run: flutter analyze lib/screens/training_plans_screen.dart

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/training_plans_screen.dart pubspec.yaml
          git commit -m "Link training units to events and show reminders"
          git push origin main
