name: Improve Chat View

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve-chat-view:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply chat improvements
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/improve_chat.py
          python3 /tmp/improve_chat.py

      - name: Format
        run: dart format lib/screens/messages_screen.dart

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Build web
        run: >
          flutter build web
          --release
          --base-href "/Jugendfeuerwehr-Seehausen-Kyffh-user/"
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Verify
        run: |
          grep -q "_dayLabel" lib/screens/messages_screen.dart
          grep -q "Heute" lib/screens/messages_screen.dart
          grep -q "Gestern" lib/screens/messages_screen.dart
          grep -q "_showSenderName" lib/screens/messages_screen.dart

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/messages_screen.dart

          if git diff --cached --quiet; then
            echo "Keine Änderungen nötig."
            exit 0
          fi

          git commit -m "Improve chat message layout"
          git push origin main
