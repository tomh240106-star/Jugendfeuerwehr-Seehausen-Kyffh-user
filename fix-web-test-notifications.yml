name: Fix Web Test Notifications

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-web-test-notifications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix foreground web notifications
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("web/index.html")
          s = p.read_text(encoding="utf-8")

          old = '''      if (source !== "jf_alarm") return;

                window.jfWebAlarmStart(
                  data.alarm_id || "active",
                  data.title || "JUGENDFEUERWEHR-ALARM",
                  data.body || "Alarm öffnen und Rückmeldung geben."
                );

                const title =
                  data.title ||
                  payload?.notification?.title ||
                  "JUGENDFEUERWEHR-ALARM";

                const body =
                  data.body ||
                  payload?.notification?.body ||
                  "Alarm öffnen und Rückmeldung geben.";

                if (Notification.permission === "granted") {
                  jfGetPushRegistration().then((registration) => {
                    registration.showNotification(title, {
                      body,
                      icon: data.icon_url || "icons/Icon-192.png",
                      badge: data.icon_url || "icons/Icon-192.png",
                      tag: `jf-alarm-${data.alarm_id || "active"}`,
                      renotify: true,
                      requireInteraction: true,
                      silent: false,
                      vibrate: [500, 200, 500, 200, 900],
                      data: {
                        ...data,
                        click_url:
                          data.click_url ||
                          window.location.origin +
                            "/Jugendfeuerwehr-Seehausen-Kyffh-user/"
                      }
                    });
                  });
                }
          '''

          new = '''      const isAlarm = source === "jf_alarm";

                if (isAlarm) {
                  window.jfWebAlarmStart(
                    data.alarm_id || "active",
                    data.title || "JUGENDFEUERWEHR-ALARM",
                    data.body || "Alarm öffnen und Rückmeldung geben."
                  );
                }

                const title =
                  data.title ||
                  payload?.notification?.title ||
                  (isAlarm ? "JUGENDFEUERWEHR-ALARM" : "Jugendfeuerwehr");

                const body =
                  data.body ||
                  payload?.notification?.body ||
                  (isAlarm
                    ? "Alarm öffnen und Rückmeldung geben."
                    : "Neue Benachrichtigung");

                if (Notification.permission === "granted") {
                  jfGetPushRegistration().then((registration) => {
                    registration.showNotification(title, {
                      body,
                      icon: data.icon_url || "icons/Icon-192.png",
                      badge: data.icon_url || "icons/Icon-192.png",
                      tag: isAlarm
                        ? `jf-alarm-${data.alarm_id || "active"}`
                        : `jf-general-${Date.now()}`,
                      renotify: isAlarm,
                      requireInteraction: isAlarm,
                      silent: false,
                      vibrate: isAlarm
                        ? [500, 200, 500, 200, 900]
                        : [250, 120, 250],
                      data: {
                        ...data,
                        click_url:
                          data.click_url ||
                          window.location.origin +
                            "/Jugendfeuerwehr-Seehausen-Kyffh-user/"
                      }
                    });
                  });
                }
          '''

          if old not in s:
              raise SystemExit("Aktueller Foreground-Handler wurde nicht gefunden.")

          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          print("Foreground-Web-Benachrichtigungen repariert.")
          PY

      - name: Verify
        run: |
          grep -q 'const isAlarm = source === "jf_alarm";' web/index.html
          grep -q 'jf-general-' web/index.html
          grep -q 'window.jfWebAlarmStart' web/index.html

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Build web
        run: >
          flutter build web
          --release
          --base-href "/Jugendfeuerwehr-Seehausen-Kyffh-user/"
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add web/index.html

          if git diff --cached --quiet; then
            echo "Keine Änderungen nötig."
            exit 0
          fi

          git commit -m "Fix foreground web test notifications"
          git push origin main
