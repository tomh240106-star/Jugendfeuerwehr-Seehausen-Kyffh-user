name: Add Configurable Event Reminders V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch reminder settings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          controls = base64.b64decode("").decode()

          path = Path("lib/screens/home_shell.dart")
          full = path.read_text(encoding="utf-8")

          start = full.find("class _MyProfileScreenState")
          end = full.find("class _InfoScreen", start)
          if start == -1 or end == -1:
              raise SystemExit("MyProfile section not found")

          text = full[start:end]

          if "bool _eventRemindersEnabled = true;" not in text:
              anchor = "  bool _notificationsEnabled = true;"
              if anchor not in text:
                  raise SystemExit("notifications state field not found")
              text = text.replace(
                  anchor,
                  anchor + "\n  bool _eventRemindersEnabled = true;\n  int _reminderMinutes = 30;",
                  1,
              )

          old_select = "'first_name,last_name,phone,role,notifications_enabled'"
          new_select = "'first_name,last_name,phone,role,notifications_enabled,event_reminders_enabled,reminder_minutes'"
          if new_select not in text:
              if old_select not in text:
                  raise SystemExit("profile select fields not found")
              text = text.replace(old_select, new_select, 1)

          load_anchor = "      _notificationsEnabled = profile?['notifications_enabled'] != false;"
          if "profile?['event_reminders_enabled']" not in text:
              if load_anchor not in text:
                  raise SystemExit("notifications load line not found")
              text = text.replace(
                  load_anchor,
                  load_anchor
                  + "\n      _eventRemindersEnabled = profile?['event_reminders_enabled'] != false;"
                  + "\n      _reminderMinutes = (profile?['reminder_minutes'] as num?)?.toInt() ?? 30;",
                  1,
              )

          save_anchor = "        'notifications_enabled': _notificationsEnabled,"
          if "'event_reminders_enabled': _eventRemindersEnabled," not in text:
              if save_anchor not in text:
                  raise SystemExit("notifications save field not found")
              text = text.replace(
                  save_anchor,
                  save_anchor
                  + "\n        'event_reminders_enabled': _eventRemindersEnabled,"
                  + "\n        'reminder_minutes': _reminderMinutes,",
                  1,
              )

          if "Automatische Terminerinnerung" not in text:
              needle = "'Termine, Nachrichten, Dokumente und Ausbildung'"
              pos = text.find(needle)
              if pos == -1:
                  raise SystemExit("notification description text not found")

              close_marker = "                    ],\n                  ),\n                ),\n                if (kIsWeb)"
              insert_pos = text.find(close_marker, pos)
              if insert_pos == -1:
                  raise SystemExit("notification card closing marker not found")

              text = text[:insert_pos] + controls + text[insert_pos:]

          full = full[:start] + text + full[end:]
          path.write_text(full, encoding="utf-8")

          pubspec = Path("pubspec.yaml")
          p = pubspec.read_text(encoding="utf-8")
          if "version: 1.0.4+6" in p:
              p = p.replace("version: 1.0.4+6", "version: 1.0.5+7", 1)
          elif "version: 1.0.5+7" not in p:
              raise SystemExit("Expected app version not found")
          pubspec.write_text(p, encoding="utf-8")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Format
        run: dart format lib/screens/home_shell.dart

      - name: Analyze
        run: flutter analyze lib/screens/home_shell.dart

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_shell.dart pubspec.yaml
          git commit -m "Add configurable event reminders"
          git push origin main
