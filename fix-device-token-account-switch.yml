name: Fix Device Token Account Switch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-device-token:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch web and native token saving
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("lib/services/push_service_web.dart"),
              Path("lib/services/push_service_native.dart"),
          ]

          old = """    await client.from('device_tokens').upsert(
      {
        'user_id': user.id,
        'token': token,
        'platform': PLATFORM_VALUE,
      },
      onConflict: 'token',
    );
"""

          for p in files:
              text = p.read_text()

              if p.name == "push_service_web.dart":
                  platform = "'web'"
              else:
                  platform = "Platform.isIOS ? 'ios' : 'android'"

              existing = old.replace("PLATFORM_VALUE", platform)

              replacement = f"""    await client.rpc(
      'claim_device_token',
      params: {{
        'p_token': token,
        'p_platform': {platform},
      }},
    );
"""

              if existing in text:
                  text = text.replace(existing, replacement, 1)
              elif "'claim_device_token'" not in text:
                  raise SystemExit(f"Token-Speicherblock in {p} nicht gefunden.")

              p.write_text(text)

      - name: Format
        run: dart format lib/services/push_service_web.dart lib/services/push_service_native.dart

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Web build test
        run: >
          flutter build web
          --release
          --base-href "/Jugendfeuerwehr-Seehausen-Kyffh-user/"
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Commit fix
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            lib/services/push_service_web.dart \
            lib/services/push_service_native.dart

          if git diff --cached --quiet; then
            echo "Fix bereits vorhanden."
            exit 0
          fi

          git commit -m "Fix push token transfer between accounts"
          git push origin main

      - name: Summary
        run: |
          echo "### Device-Token-Kontowechsel repariert" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web-Token kann sicher einem neu angemeldeten Konto zugeordnet werden" >> "$GITHUB_STEP_SUMMARY"
          echo "- Derselbe Fix gilt auch für Android/iOS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flutter Analyze und Web Build erfolgreich" >> "$GITHUB_STEP_SUMMARY"
