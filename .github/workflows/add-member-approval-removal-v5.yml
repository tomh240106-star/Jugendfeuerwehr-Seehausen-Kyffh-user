name: Add Member Approval And Removal V5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          approval_code = base64.b64decode("").decode()
          helper_code = base64.b64decode("").decode()
          action_buttons = base64.b64decode("").decode()

          main = Path("lib/main.dart")
          text = main.read_text(encoding="utf-8")
          if "import 'dart:async';" not in text:
              text = "import 'dart:async';\n\n" + text
          if "return const ApprovalGate();" not in text:
              if "        return const HomeShell();" not in text:
                  raise SystemExit("AuthGate HomeShell return not found")
              text = text.replace(
                  "        return const HomeShell();",
                  "        return const ApprovalGate();",
                  1,
              )
          if "class ApprovalGate extends StatefulWidget" not in text:
              text += approval_code
          main.write_text(text, encoding="utf-8")

          auth = Path("lib/screens/auth_screen.dart")
          text = auth.read_text(encoding="utf-8")
          old = "Registrierung erfolgreich. Bitte prüfe deine E-Mails, falls eine Bestätigung erforderlich ist."
          new = "Registrierung erfolgreich. Nach einer eventuell erforderlichen E-Mail-Bestätigung muss dein Konto noch von mindestens einem Ausbilder freigegeben werden."
          if old in text:
              text = text.replace(old, new, 1)
          auth.write_text(text, encoding="utf-8")

          members = Path("lib/screens/members_screen.dart")
          text = members.read_text(encoding="utf-8")

          old_select = ".select('id,first_name,last_name,role,phone,notifications_enabled')"
          new_select = ".select('id,first_name,last_name,role,phone,notifications_enabled,approval_status,approved_at')"
          if old_select in text:
              text = text.replace(old_select, new_select, 1)

          if "Future<void> _approveAccount()" not in text:
              anchor = "  Future<void> _save() async {"
              if anchor not in text:
                  raise SystemExit("Profile editor save method not found")
              text = text.replace(anchor, helper_code + anchor, 1)

          if "Konto freigeben" not in text:
              label = "                label: const Text('Speichern'),"
              label_pos = text.find(label)
              if label_pos == -1:
                  raise SystemExit("Save button label not found")

              # Find the end of the surrounding SizedBox directly after the label.
              end_marker = "\n            ),"
              end_pos = text.find(end_marker, label_pos)
              if end_pos == -1:
                  raise SystemExit("Save button end not found")
              insert_pos = end_pos + len(end_marker)
              text = text[:insert_pos] + action_buttons + text[insert_pos:]

          members.write_text(text, encoding="utf-8")

          pubspec = Path("pubspec.yaml")
          p = pubspec.read_text(encoding="utf-8")
          if "version: 1.0.3+5" in p:
              p = p.replace("version: 1.0.3+5", "version: 1.0.4+6", 1)
          elif "version: 1.0.4+6" not in p:
              raise SystemExit("Expected app version not found")
          pubspec.write_text(p, encoding="utf-8")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Format
        run: dart format lib/main.dart lib/screens/auth_screen.dart lib/screens/members_screen.dart

      - name: Analyze
        run: flutter analyze lib/main.dart lib/screens/auth_screen.dart lib/screens/members_screen.dart

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/screens/auth_screen.dart lib/screens/members_screen.dart pubspec.yaml
          git commit -m "Add member approval and removal"
          git push origin main
