name: Fix Android Alarm Recipient Scrolling

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch alarm recipient list
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/screens/alarm_screen.dart")
          text = path.read_text(encoding="utf-8")

          old = '''                      child: eligible.isEmpty
                          ? const Padding(
                              padding: EdgeInsets.all(16),
                              child: Text(
                                'Keine weiteren Jugendmitglieder oder Ausbilder vorhanden.',
                              ),
                            )
                          : ListView.separated(
                              shrinkWrap: true,
                              itemCount: eligible.length,
                              separatorBuilder: (_, __) =>
                                  const Divider(height: 1),
                              itemBuilder: (context, index) {
                                final person = eligible[index];
                                final id = person['id']?.toString() ?? '';
                                final selected = selectedIds.contains(id);

                                return CheckboxListTile(
                                  value: selected,
                                  dense: true,
                                  controlAffinity:
                                      ListTileControlAffinity.leading,
                                  title: Text(
                                    nameOf(person),
                                    style: const TextStyle(
                                      fontWeight: FontWeight.w700,
                                    ),
                                  ),
                                  subtitle: Text(roleOf(person)),
                                  onChanged: id.isEmpty
                                      ? null
                                      : (value) {
                                          setDialogState(() {
                                            if (value == true) {
                                              selectedIds.add(id);
                                            } else {
                                              selectedIds.remove(id);
                                            }
                                          });
                                        },
                                );
                              },
                            ),'''

          new = '''                      child: eligible.isEmpty
                          ? const Padding(
                              padding: EdgeInsets.all(16),
                              child: Text(
                                'Keine weiteren Jugendmitglieder oder Ausbilder vorhanden.',
                              ),
                            )
                          : Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                for (var index = 0;
                                    index < eligible.length;
                                    index++) ...[
                                  Builder(
                                    builder: (context) {
                                      final person = eligible[index];
                                      final id =
                                          person['id']?.toString() ?? '';
                                      final selected =
                                          selectedIds.contains(id);

                                      return CheckboxListTile(
                                        value: selected,
                                        dense: true,
                                        controlAffinity:
                                            ListTileControlAffinity.leading,
                                        title: Text(
                                          nameOf(person),
                                          style: const TextStyle(
                                            fontWeight: FontWeight.w700,
                                          ),
                                        ),
                                        subtitle: Text(roleOf(person)),
                                        onChanged: id.isEmpty
                                            ? null
                                            : (value) {
                                                setDialogState(() {
                                                  if (value == true) {
                                                    selectedIds.add(id);
                                                  } else {
                                                    selectedIds.remove(id);
                                                  }
                                                });
                                              },
                                      );
                                    },
                                  ),
                                  if (index < eligible.length - 1)
                                    const Divider(height: 1),
                                ],
                              ],
                            ),'''

          if old not in text:
              raise SystemExit("Target block not found - file may already be changed.")

          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze alarm screen
        run: flutter analyze lib/screens/alarm_screen.dart

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/alarm_screen.dart
          git commit -m "Fix Android alarm recipient scrolling"
          git push origin main
