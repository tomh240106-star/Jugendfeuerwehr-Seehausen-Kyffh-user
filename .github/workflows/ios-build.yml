name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "ios/**"
      - "pubspec.yaml"
      - ".github/workflows/ios-build.yml"

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter and Xcode versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Create or repair iOS project
        run: |
          set -e

          if [ ! -d ios ] || [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            echo "iOS-Projekt fehlt oder ist unvollständig - wird erzeugt."
            rm -rf ios
            flutter create . \
              --platforms=ios \
              --org de.jfseehausen \
              --project-name jf_seehausen_kyffhaeuser
          else
            echo "iOS-Projekt ist vorhanden."
          fi

          test -f ios/Runner.xcodeproj/project.pbxproj || {
            echo "FEHLER: iOS-Projekt konnte nicht erzeugt werden."
            exit 1
          }

      - name: Set iOS bundle identifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = p.read_text()

          text = re.sub(
              r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;',
              'PRODUCT_BUNDLE_IDENTIFIER = de.jfseehausen.kyffhaeuser;',
              text
          )

          text = re.sub(
              r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;',
              'IPHONEOS_DEPLOYMENT_TARGET = 15.0;',
              text
          )

          p.write_text(text)
          print("Bundle-ID gesetzt: de.jfseehausen.kyffhaeuser")
          print("iOS Deployment Target gesetzt: 15.0")
          PY

      - name: Restore Firebase iOS config
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "FEHLER: Secret GOOGLE_SERVICE_INFO_PLIST_BASE64 fehlt."
            exit 1
          fi

          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist

          test -s ios/Runner/GoogleService-Info.plist || {
            echo "FEHLER: GoogleService-Info.plist konnte nicht erstellt werden."
            exit 1
          }

      - name: Add iOS alarm sound
        run: |
          set -e

          if [ -f android/app/src/main/res/raw/jf_alarm.wav ]; then
            cp android/app/src/main/res/raw/jf_alarm.wav ios/Runner/jf_alarm.wav
          else
            echo "FEHLER: jf_alarm.wav fehlt im Android-Projekt."
            exit 1
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Create Podfile if missing
        run: |
          set -e

          if [ ! -f ios/Podfile ]; then
            echo "Podfile fehlt - wird für Flutter/iOS erzeugt."

            cat > ios/Podfile <<'RUBY'
          platform :ios, '15.0'

          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(
              File.join('..', 'Flutter', 'Generated.xcconfig'),
              __FILE__
            )

            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. Run flutter pub get first."
            end

            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end

            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}."
          end

          require File.expand_path(
            File.join(
              'packages',
              'flutter_tools',
              'bin',
              'podhelper'
            ),
            flutter_root
          )

          flutter_ios_podfile_setup

          target 'Runner' do
            use_frameworks!
            use_modular_headers!

            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)

              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              end
            end
          end
          RUBY
          fi

          test -f ios/Podfile || {
            echo "FEHLER: Podfile konnte nicht erzeugt werden."
            exit 1
          }

          echo "===== ios/Podfile ====="
          cat ios/Podfile

      - name: Configure iOS notification capabilities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          info = Path("ios/Runner/Info.plist")

          with info.open("rb") as f:
              data = plistlib.load(f)

          data["FirebaseAppDelegateProxyEnabled"] = True

          with info.open("wb") as f:
              plistlib.dump(data, f)

          ent = Path("ios/Runner/Runner.entitlements")
          ent.write_text("""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>development</string>
          </dict>
          </plist>
          """)
          PY

      - name: Install CocoaPods dependencies
        run: |
          set -e
          cd ios
          pod repo update
          pod install
          cd ..

      - name: Verify iOS files
        run: |
          set -e
          test -f ios/Podfile
          test -f ios/Podfile.lock
          test -f ios/Runner/GoogleService-Info.plist
          test -f ios/Runner/jf_alarm.wav
          test -f ios/Runner.xcworkspace/contents.xcworkspacedata

      - name: Analyze active Flutter app
        run: |
          # Nur den tatsächlich verwendeten App-Code unter lib/ prüfen.
          # Alte Dart-Dateien im Projektstamm gehören nicht zum aktuellen App-Einstiegspunkt.
          flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build iOS without codesigning
        run: >
          flutter build ios
          --release
          --no-codesign
          --target=lib/main.dart
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Package unsigned iOS app
        run: |
          set -e
          cd build/ios/iphoneos
          zip -r jf-seehausen-ios-unsigned.zip Runner.app

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: jf-seehausen-ios-unsigned
          path: build/ios/iphoneos/jf-seehausen-ios-unsigned.zip
          if-no-files-found: error
