name: Show Reminder On Events

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch event reminder display
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          helper = base64.b64decode("").decode()
          detail_block = base64.b64decode("").decode()
          card_block = base64.b64decode("").decode()

          path = Path("lib/screens/events_screen.dart")
          text = path.read_text(encoding="utf-8")

          if "bool _eventRemindersEnabled = true;" not in text:
              anchor = "  String? _role;"
              if anchor not in text:
                  raise SystemExit("role state anchor not found")
              text = text.replace(
                  anchor,
                  anchor + "\n  bool _eventRemindersEnabled = true;\n  int _reminderMinutes = 30;",
                  1,
              )

          old_select = ".select('id, role')"
          new_select = ".select('id, role, event_reminders_enabled, reminder_minutes')"
          if new_select not in text:
              if old_select not in text:
                  raise SystemExit("role profile select not found")
              text = text.replace(old_select, new_select, 1)

          if "profile?['event_reminders_enabled']" not in text:
              anchor = "        _isTrainer = role == 'ausbilder';"
              if anchor not in text:
                  raise SystemExit("trainer state anchor not found")
              text = text.replace(
                  anchor,
                  anchor
                  + "\n        _eventRemindersEnabled = profile?['event_reminders_enabled'] != false;"
                  + "\n        _reminderMinutes = (profile?['reminder_minutes'] as num?)?.toInt() ?? 30;",
                  1,
              )

          if "String _reminderLabel()" not in text:
              anchor = "  String _attendanceLabel(String? status) {"
              if anchor not in text:
                  raise SystemExit("attendance helper anchor not found")
              text = text.replace(anchor, helper + anchor, 1)

          if "title: 'Erinnerung'," not in text:
              anchor = """              if ((event['location'] ?? '').toString().isNotEmpty)
                _DetailRow("""
              pos = text.find(anchor)
              if pos == -1:
                  raise SystemExit("detail location anchor not found")
              text = text[:pos] + detail_block + text[pos:]

          card_start = text.find("children: _filteredEvents.map")
          if card_start == -1:
              raise SystemExit("event card section not found")

          if "'Erinnerung: ${_reminderLabel()}'" not in text[card_start:]:
              anchor = """                                            if ((event['location'] ?? '')
                                                .toString()
                                                .isNotEmpty) ...["""
              pos = text.find(anchor, card_start)
              if pos == -1:
                  raise SystemExit("event card location anchor not found")
              text = text[:pos] + card_block + text[pos:]

          path.write_text(text, encoding="utf-8")

          pubspec = Path("pubspec.yaml")
          p = pubspec.read_text(encoding="utf-8")
          if "version: 1.0.5+7" in p:
              p = p.replace("version: 1.0.5+7", "version: 1.0.6+8", 1)
          elif "version: 1.0.6+8" not in p:
              raise SystemExit("Expected version 1.0.5+7 not found")
          pubspec.write_text(p, encoding="utf-8")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Format
        run: dart format lib/screens/events_screen.dart

      - name: Analyze
        run: flutter analyze lib/screens/events_screen.dart

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/events_screen.dart pubspec.yaml
          git commit -m "Show reminder time on events"
          git push origin main
