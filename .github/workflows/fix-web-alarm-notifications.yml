name: Fix Web Alarm Notifications

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-web-alarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Update service worker
        env:
          SW_B64: ""
        run: |
          echo "$SW_B64" | base64 --decode > web/firebase-messaging-sw.js

      - name: Add foreground alarm handling
        env:
          FG_B64: ""
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("web/index.html")
          text = path.read_text(encoding="utf-8")
          marker = "    window.jfWebPushGetToken = async function () {\n"
          block = base64.b64decode(os.environ["FG_B64"]).decode("utf-8")

          if "jfMessaging.onMessage((payload)" not in text:
              if marker not in text:
                  raise SystemExit("Einfügestelle in web/index.html nicht gefunden.")
              text = text.replace(marker, block + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Build web
        run: >
          flutter build web
          --release
          --base-href "/Jugendfeuerwehr-Seehausen-Kyffh-user/"
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Verify
        run: |
          grep -q "onBackgroundMessage" build/web/firebase-messaging-sw.js
          grep -q "showNotification" build/web/firebase-messaging-sw.js
          grep -q "requireInteraction" build/web/firebase-messaging-sw.js
          grep -q "silent: false" build/web/firebase-messaging-sw.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/firebase-messaging-sw.js web/index.html
          if git diff --cached --quiet; then
            echo "Fix bereits vorhanden."
            exit 0
          fi
          git commit -m "Fix web alarm notifications"
          git push origin main
