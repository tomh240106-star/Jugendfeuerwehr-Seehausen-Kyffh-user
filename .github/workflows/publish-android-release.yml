name: Publish Android GitHub Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          FULL_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '"[:space:]')"
          VERSION_NAME="${FULL_VERSION%%+*}"
          BUILD_NUMBER="${FULL_VERSION##*+}"

          if [[ -z "$VERSION_NAME" || -z "$BUILD_NUMBER" || ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "FEHLER: Ungültige Version in pubspec.yaml: $FULL_VERSION"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Find latest successful release package workflow
        id: release_run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID="$(
            gh run list \
              --repo "${{ github.repository }}" \
              --workflow "release-package.yml" \
              --status success \
              --limit 20 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == "${{ github.sha }}") | .databaseId' \
              | head -n1
          )"

          if [[ -z "$RUN_ID" ]]; then
            RUN_ID="$(
              gh run list \
                --repo "${{ github.repository }}" \
                --workflow "release-package.yml" \
                --status success \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId'
            )"
          fi

          if [[ -z "$RUN_ID" ]]; then
            echo "FEHLER: Kein erfolgreicher Prepare-Android-Release-Package-Lauf gefunden."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Verwende Release-Package Run: $RUN_ID"

      - name: Download prepared release package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version_name }}"
          BUILD="${{ steps.version.outputs.build_number }}"
          RUN_ID="${{ steps.release_run.outputs.run_id }}"

          mkdir -p prepared

          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "jf-release-${VERSION}-build-${BUILD}" \
            --dir prepared

          test -f "prepared/Jugendfeuerwehr-${VERSION}-build${BUILD}-arm64-v8a.apk"

      - name: Prepare stable Android download file
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version_name }}"
          BUILD="${{ steps.version.outputs.build_number }}"

          cp \
            "prepared/Jugendfeuerwehr-${VERSION}-build${BUILD}-arm64-v8a.apk" \
            "Jugendfeuerwehr-Seehausen-Android.apk"

          sha256sum "Jugendfeuerwehr-Seehausen-Android.apk"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version_name }}"
          BUILD="${{ steps.version.outputs.build_number }}"
          TAG="v${VERSION}-build${BUILD}"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "Jugendfeuerwehr-Seehausen-Android.apk" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "$TAG" \
              "Jugendfeuerwehr-Seehausen-Android.apk" \
              --repo "${{ github.repository }}" \
              --title "Jugendfeuerwehr Seehausen ${VERSION} (Build ${BUILD})" \
              --notes "Stabile Android-Version der Jugendfeuerwehr Seehausen/Kyffhäuser. ARM64-APK für aktuelle Android-Geräte." \
              --latest
          fi

      - name: Write summary
        shell: bash
        run: |
          {
            echo "## Android GitHub Release veröffentlicht"
            echo
            echo "**Version:** ${{ steps.version.outputs.version_name }}"
            echo "**Build:** ${{ steps.version.outputs.build_number }}"
            echo
            echo "Dauerhafter Download-Link:"
            echo
            echo "https://github.com/${{ github.repository }}/releases/latest/download/Jugendfeuerwehr-Seehausen-Android.apk"
          } >> "$GITHUB_STEP_SUMMARY"
