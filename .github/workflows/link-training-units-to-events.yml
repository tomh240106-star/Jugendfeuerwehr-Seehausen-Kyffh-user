name: Link Training Units To Events

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add linked training event reminders
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          reminder_helpers = base64.b64decode("").decode()
          editor_helpers = base64.b64decode("").decode()
          dropdown_block = base64.b64decode("").decode()
          details_link_block = base64.b64decode("").decode()

          path = Path("lib/screens/training_plans_screen.dart")
          text = path.read_text(encoding="utf-8")

          details_start = text.find("class _TrainingPlanDetailsScreenState")
          editor_start = text.find("class _TrainingUnitEditorState")
          if details_start == -1 or editor_start == -1:
              raise SystemExit("training screen sections not found")

          # Reminder state in training plan details.
          details_prefix = text[details_start:editor_start]
          if "bool _eventRemindersEnabled = true;" not in details_prefix:
              anchor = "  String _unitSearch = '';"
              pos = text.find(anchor, details_start, editor_start)
              if pos == -1:
                  raise SystemExit("unit search field not found")
              end = pos + len(anchor)
              text = (
                  text[:end]
                  + "\n  bool _eventRemindersEnabled = true;"
                  + "\n  int _reminderMinutes = 30;"
                  + text[end:]
              )
              editor_start = text.find("class _TrainingUnitEditorState")

          # Load reminder settings on opening the plan details.
          init_anchor = """  void initState() {
              super.initState();
              _loadUnits();
            }"""
          details_prefix = text[details_start:editor_start]
          if "_loadReminderSettings();" not in details_prefix:
              if init_anchor not in details_prefix:
                  raise SystemExit("details initState block not found")
              replacement = """  void initState() {
              super.initState();
              _loadReminderSettings();
              _loadUnits();
            }"""
              text = text.replace(init_anchor, replacement, 1)
              editor_start = text.find("class _TrainingUnitEditorState")

          # Load joined event data with each training unit.
          details_prefix = text[details_start:editor_start]
          old_select = ".from('training_units')\n          .select()"
          new_select = ".from('training_units')\n          .select('*, events(id,title,starts_at,ends_at,location)')"
          if "events(id,title,starts_at,ends_at,location)" not in details_prefix:
              if old_select not in details_prefix:
                  raise SystemExit("training units select not found")
              absolute = text.find(old_select, details_start, editor_start)
              text = text[:absolute] + new_select + text[absolute + len(old_select):]
              editor_start = text.find("class _TrainingUnitEditorState")

          # Reminder/event helper methods.
          details_prefix = text[details_start:editor_start]
          if "Future<void> _loadReminderSettings()" not in details_prefix:
              pos = text.find("  Future<void> _loadUnits()", details_start, editor_start)
              if pos == -1:
                  raise SystemExit("loadUnits method not found")
              text = text[:pos] + reminder_helpers + text[pos:]
              editor_start = text.find("class _TrainingUnitEditorState")

          # Show linked event and reminder inside the expanded training unit.
          details_prefix = text[details_start:editor_start]
          if "'Erinnerung'," not in details_prefix:
              anchor = """                              _detail(
                                'Lernziel',"""
              pos = text.find(anchor, details_start, editor_start)
              if pos == -1:
                  raise SystemExit("unit detail anchor not found")
              text = text[:pos] + details_link_block + text[pos:]
              editor_start = text.find("class _TrainingUnitEditorState")

          # Editor state: available event list + selected event.
          editor_end = len(text)
          editor_section = text[editor_start:editor_end]
          if "List<Map<String, dynamic>> _availableEvents" not in editor_section:
              anchor = "  bool _saving = false;"
              pos = text.find(anchor, editor_start)
              if pos == -1:
                  raise SystemExit("editor saving field not found")
              end = pos + len(anchor)
              text = (
                  text[:end]
                  + "\n  bool _loadingEvents = true;"
                  + "\n  List<Map<String, dynamic>> _availableEvents = [];"
                  + "\n  String? _selectedEventId;"
                  + text[end:]
              )

          # Editor init: keep current event link and load events.
          editor_start = text.find("class _TrainingUnitEditorState")
          editor_section = text[editor_start:]
          if "_loadAvailableEvents();" not in editor_section:
              anchor = """    _sortOrder = TextEditingController(
              text: widget.unit?['sort_order']?.toString() ??
                  (widget.suggestedOrder ?? 0).toString(),
            );"""
              pos = text.find(anchor, editor_start)
              if pos == -1:
                  raise SystemExit("editor init anchor not found")
              end = pos + len(anchor)
              text = (
                  text[:end]
                  + "\n    _selectedEventId = widget.unit?['event_id']?.toString();"
                  + "\n    _loadAvailableEvents();"
                  + text[end:]
              )

          # Editor event helper methods.
          editor_start = text.find("class _TrainingUnitEditorState")
          if "Future<void> _loadAvailableEvents()" not in text[editor_start:]:
              pos = text.find("  Future<void> _save()", editor_start)
              if pos == -1:
                  raise SystemExit("editor save method not found")
              text = text[:pos] + editor_helpers + text[pos:]

          # Save the selected event_id.
          editor_start = text.find("class _TrainingUnitEditorState")
          editor_section = text[editor_start:]
          if "'event_id': _selectedEventId," not in editor_section:
              anchor = "      'training_plan_id': widget.trainingPlanId,"
              pos = text.find(anchor, editor_start)
              if pos == -1:
                  raise SystemExit("training_plan_id data field not found")
              end = pos + len(anchor)
              text = text[:end] + "\n      'event_id': _selectedEventId," + text[end:]

          # Add event dropdown below topic.
          editor_start = text.find("class _TrainingUnitEditorState")
          editor_section = text[editor_start:]
          if "labelText: 'Mit Termin verknüpfen'" not in editor_section:
              topic_anchor = """              TextFormField(
                controller: _objectives,"""
              pos = text.find(topic_anchor, editor_start)
              if pos == -1:
                  raise SystemExit("objectives field anchor not found")
              text = text[:pos] + dropdown_block + text[pos:]

          path.write_text(text, encoding="utf-8")

          # Version bump.
          pubspec = Path("pubspec.yaml")
          p = pubspec.read_text(encoding="utf-8")
          if "version: 1.0.6+8" in p:
              p = p.replace("version: 1.0.6+8", "version: 1.0.7+9", 1)
          elif "version: 1.0.7+9" not in p:
              raise SystemExit("Expected version 1.0.6+8 not found")
          pubspec.write_text(p, encoding="utf-8")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Format
        run: dart format lib/screens/training_plans_screen.dart

      - name: Analyze
        run: flutter analyze lib/screens/training_plans_screen.dart

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/training_plans_screen.dart pubspec.yaml
          git commit -m "Link training units to events and show reminders"
          git push origin main
