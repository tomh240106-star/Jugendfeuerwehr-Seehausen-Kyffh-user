name: Prepare Android Release Package

on:
  workflow_run:
    workflows:
      - Android Build
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  prepare-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          FULL_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '"[:space:]')"

          if [[ -z "$FULL_VERSION" || "$FULL_VERSION" != *"+"* ]]; then
            echo "FEHLER: pubspec.yaml muss eine Version wie 1.0.18+18 enthalten."
            exit 1
          fi

          VERSION_NAME="${FULL_VERSION%%+*}"
          BUILD_NUMBER="${FULL_VERSION##*+}"

          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "FEHLER: Buildnummer ist nicht numerisch: $BUILD_NUMBER"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Download APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloaded/arm64 downloaded/armv7 downloaded/x86_64

          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name jf-seehausen-apk-arm64-v8a \
            --dir downloaded/arm64

          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name jf-seehausen-apk-armeabi-v7a \
            --dir downloaded/armv7

          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name jf-seehausen-apk-x86_64 \
            --dir downloaded/x86_64

      - name: Create clean release files
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version_name }}"
          BUILD="${{ steps.version.outputs.build_number }}"

          mkdir -p release

          cp "$(find downloaded/arm64 -type f -name '*.apk' | head -n1)" \
            "release/Jugendfeuerwehr-${VERSION}-build${BUILD}-arm64-v8a.apk"

          cp "$(find downloaded/armv7 -type f -name '*.apk' | head -n1)" \
            "release/Jugendfeuerwehr-${VERSION}-build${BUILD}-armeabi-v7a.apk"

          cp "$(find downloaded/x86_64 -type f -name '*.apk' | head -n1)" \
            "release/Jugendfeuerwehr-${VERSION}-build${BUILD}-x86_64.apk"

      - name: Create checksums and manifest
        shell: bash
        run: |
          set -euo pipefail

          cd release
          sha256sum *.apk > SHA256SUMS.txt
          cd ..

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          version = "${{ steps.version.outputs.version_name }}"
          build = int("${{ steps.version.outputs.build_number }}")

          release_dir = Path("release")
          files = []

          for abi in ("arm64-v8a", "armeabi-v7a", "x86_64"):
              path = release_dir / f"Jugendfeuerwehr-{version}-build{build}-{abi}.apk"
              data = path.read_bytes()

              files.append({
                  "abi": abi,
                  "file_name": path.name,
                  "size_bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })

          manifest = {
              "platform": "android",
              "version_name": version,
              "build_number": build,
              "recommended_initial_channel": "non",
              "recommended_force_update": False,
              "files": files,
              "source_commit": "${{ github.event.workflow_run.head_sha }}",
              "source_android_run_id": int("${{ github.event.workflow_run.id }}"),
          }

          (release_dir / "release_manifest.json").write_text(
              json.dumps(
                  manifest,
                  indent=2,
                  ensure_ascii=False,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify Supabase Free size limit
        shell: bash
        run: |
          set -euo pipefail

          MAX_BYTES=$((50 * 1024 * 1024))

          for APK in release/*.apk; do
            SIZE="$(stat -c%s "$APK")"
            echo "$(basename "$APK"): $SIZE bytes"

            if [ "$SIZE" -gt "$MAX_BYTES" ]; then
              echo "FEHLER: $(basename "$APK") ist größer als 50 MiB."
              exit 1
            fi
          done

      - name: Upload ARM64 and ARMv7 to Supabase Update Server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version_name }}"
          BUILD="${{ steps.version.outputs.build_number }}"

          if [[ -z "${SUPABASE_URL:-}" ]]; then
            echo "FEHLER: SUPABASE_URL Secret fehlt."
            exit 1
          fi

          if [[ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "FEHLER: SUPABASE_SERVICE_ROLE_KEY Secret fehlt."
            exit 1
          fi

          upload_release() {
            ABI="$1"
            FILE="$2"

            SIZE="$(stat -c%s "$FILE")"
            SHA="$(sha256sum "$FILE" | awk '{print $1}')"

            STORAGE_PATH="android/${BUILD}_${VERSION}_${ABI}.apk"

            echo "Lade ${ABI} nach Supabase hoch..."

            curl --fail-with-body \
              --request POST \
              "${SUPABASE_URL}/storage/v1/object/app-updates/${STORAGE_PATH}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/vnd.android.package-archive" \
              --header "x-upsert: true" \
              --data-binary "@${FILE}"

            echo
            echo "Trage ${ABI} in app_releases ein..."

            JSON="$(
              jq -n \
                --arg version "$VERSION" \
                --argjson build "$BUILD" \
                --arg abi "$ABI" \
                --arg path "$STORAGE_PATH" \
                --arg sha "$SHA" \
                --argjson size "$SIZE" \
                --arg notes "Automatisch erstellt aus GitHub Android Build ${{ github.event.workflow_run.id }}" \
                '{
                  platform: "android",
                  version_name: $version,
                  build_number: $build,
                  channel: "non",
                  abi: $abi,
                  storage_path: $path,
                  sha256: $sha,
                  file_size_bytes: $size,
                  notes: $notes,
                  force_update: false,
                  is_active: true,
                  created_by: null,
                  updated_by: null
                }'
            )"

            curl --fail-with-body \
              --request POST \
              "${SUPABASE_URL}/rest/v1/app_releases?on_conflict=platform,build_number,abi" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --header "Prefer: resolution=merge-duplicates,return=minimal" \
              --data "${JSON}"

            echo
            echo "${ABI} erfolgreich angelegt."
          }

          upload_release \
            "arm64-v8a" \
            "release/Jugendfeuerwehr-${VERSION}-build${BUILD}-arm64-v8a.apk"

          upload_release \
            "armeabi-v7a" \
            "release/Jugendfeuerwehr-${VERSION}-build${BUILD}-armeabi-v7a.apk"

      - name: Upload complete release package
        uses: actions/upload-artifact@v4
        with:
          name: jf-release-${{ steps.version.outputs.version_name }}-build-${{ steps.version.outputs.build_number }}
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Write release summary
        shell: bash
        run: |
          {
            echo "## Android Release vorbereitet"
            echo
            echo "**Version:** ${{ steps.version.outputs.version_name }}"
            echo
            echo "**Build:** ${{ steps.version.outputs.build_number }}"
            echo
            echo "**Update-Server:** automatisch hochgeladen"
            echo
            echo "**ARM64:** NON"
            echo
            echo "**ARMv7:** NON"
            echo
            echo "**Pflichtupdate:** Nein"
            echo
            echo "**Aktiv:** Ja"
            echo
            echo
            echo "Nach erfolgreichem Test im Update-Server auf BETA oder FOR ALL umstellen."
          } >> "$GITHUB_STEP_SUMMARY"
