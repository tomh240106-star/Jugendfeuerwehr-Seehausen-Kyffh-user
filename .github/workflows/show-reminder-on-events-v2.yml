name: Show Reminder On Events V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch event reminder display
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          helper = base64.b64decode("").decode()
          detail_block = base64.b64decode("").decode()
          card_block = base64.b64decode("").decode()

          path = Path("lib/screens/events_screen.dart")
          text = path.read_text(encoding="utf-8")

          # Limit state/query edits to EventsScreen.
          class_start = text.find("class _EventsScreenState")
          if class_start == -1:
              raise SystemExit("EventsScreen state not found")

          # Add reminder state.
          if "bool _eventRemindersEnabled = true;" not in text[class_start:]:
              pos = text.find("  String? _role;", class_start)
              if pos == -1:
                  raise SystemExit("role field not found")
              end = pos + len("  String? _role;")
              text = (
                  text[:end]
                  + "\n  bool _eventRemindersEnabled = true;"
                  + "\n  int _reminderMinutes = 30;"
                  + text[end:]
              )

          # Load reminder settings with the role.
          if "event_reminders_enabled, reminder_minutes" not in text[class_start:]:
              pos = text.find(".select('id, role')", class_start)
              if pos == -1:
                  raise SystemExit("role select not found")
              text = (
                  text[:pos]
                  + ".select('id, role, event_reminders_enabled, reminder_minutes')"
                  + text[pos + len(".select('id, role')"):]
              )

          if "profile?['event_reminders_enabled']" not in text[class_start:]:
              anchor = "_isTrainer = role == 'ausbilder';"
              pos = text.find(anchor, class_start)
              if pos == -1:
                  raise SystemExit("trainer role assignment not found")
              end = pos + len(anchor)
              text = (
                  text[:end]
                  + "\n        _eventRemindersEnabled ="
                  + "\n            profile?['event_reminders_enabled'] != false;"
                  + "\n        _reminderMinutes ="
                  + "\n            (profile?['reminder_minutes'] as num?)?.toInt() ?? 30;"
                  + text[end:]
              )

          # Add readable reminder text helper.
          if "String _reminderLabel()" not in text[class_start:]:
              pos = text.find("  String _attendanceLabel(", class_start)
              if pos == -1:
                  raise SystemExit("attendance helper not found")
              text = text[:pos] + helper + text[pos:]

          # Add reminder row in the event detail sheet.
          details_start = text.find("  void _showDetails(", class_start)
          if details_start == -1:
              raise SystemExit("event details method not found")
          details_end = text.find("\n  @override\n  Widget build", details_start)
          if details_end == -1:
              raise SystemExit("event details end not found")

          details_section = text[details_start:details_end]
          if "title: 'Erinnerung'," not in details_section:
              rel = details_section.find("if ((event['location']")
              if rel == -1:
                  raise SystemExit("detail location line not found")
              line_start = details_section.rfind("\n", 0, rel) + 1
              abs_pos = details_start + line_start
              text = text[:abs_pos] + detail_block + text[abs_pos:]

          # Recalculate card position after detail insertion.
          cards_start = text.find("children: _filteredEvents.map", class_start)
          if cards_start == -1:
              raise SystemExit("event card list not found")

          cards_section = text[cards_start:]
          if "Erinnerung: ${_reminderLabel()}" not in cards_section:
              rel = cards_section.find("if ((event['location']")
              if rel == -1:
                  raise SystemExit("event card location line not found")
              line_start = cards_section.rfind("\n", 0, rel) + 1
              abs_pos = cards_start + line_start
              text = text[:abs_pos] + card_block + text[abs_pos:]

          path.write_text(text, encoding="utf-8")

          # Version/build bump.
          pubspec = Path("pubspec.yaml")
          p = pubspec.read_text(encoding="utf-8")
          if "version: 1.0.5+7" in p:
              p = p.replace("version: 1.0.5+7", "version: 1.0.6+8", 1)
          elif "version: 1.0.6+8" not in p:
              raise SystemExit("Expected version 1.0.5+7 not found")
          pubspec.write_text(p, encoding="utf-8")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Format
        run: dart format lib/screens/events_screen.dart

      - name: Analyze
        run: flutter analyze lib/screens/events_screen.dart

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/events_screen.dart pubspec.yaml
          git commit -m "Show reminder time on events"
          git push origin main
