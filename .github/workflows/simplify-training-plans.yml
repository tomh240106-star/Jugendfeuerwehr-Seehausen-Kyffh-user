name: Simplify Training Plans

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace training plan screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          content = base64.b64decode("").decode()
          Path("lib/screens/training_plans_screen.dart").write_text(
              content,
              encoding="utf-8",
          )

          pubspec = Path("pubspec.yaml")
          text = pubspec.read_text(encoding="utf-8")
          if "version: 1.0.7+9" in text:
              text = text.replace(
                  "version: 1.0.7+9",
                  "version: 1.0.8+10",
                  1,
              )
          elif "version: 1.0.8+10" not in text:
              raise SystemExit("Expected version 1.0.7+9 not found")
          pubspec.write_text(text, encoding="utf-8")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Format
        run: dart format lib/screens/training_plans_screen.dart

      - name: Analyze
        run: flutter analyze lib/screens/training_plans_screen.dart

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/training_plans_screen.dart pubspec.yaml
          git commit -m "Simplify training plans with schedule fields"
          git push origin main
