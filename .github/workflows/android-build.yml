name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Create Android project if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi
      - name: Set Android package name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          package_name = "de.jfseehausen.kyffhaeuser"

          gradle = Path("android/app/build.gradle.kts")

          if not gradle.exists():
              raise SystemExit("android/app/build.gradle.kts wurde nicht gefunden")

          text = gradle.read_text()

          text = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              f'namespace = "{package_name}"',
              text
          )

          text = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              f'applicationId = "{package_name}"',
              text
          )

          gradle.write_text(text)

          # MainActivity suchen
          candidates = list(
              Path("android/app/src/main/kotlin").rglob("MainActivity.kt")
          )

          if candidates:
              old_file = candidates[0]

              content = old_file.read_text()

              content = re.sub(
                  r'^package\s+.*$',
                  f'package {package_name}',
                  content,
                  count=1,
                  flags=re.MULTILINE
              )

              new_dir = Path(
                  "android/app/src/main/kotlin/de/jfseehausen/kyffhaeuser"
              )

              new_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              new_file = new_dir / "MainActivity.kt"
              new_file.write_text(content)

              if old_file.resolve() != new_file.resolve():
                  old_file.unlink()

          print("Android package gesetzt auf:", package_name)
          print("")
          print("build.gradle.kts:")
          print(gradle.read_text())
          PY
                - name: Enable core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")

          if not gradle.exists():
              raise SystemExit("android/app/build.gradle.kts nicht gefunden")

          text = gradle.read_text()

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              text = re.sub(
                  r'compileOptions\s*\{',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                  text,
                  count=1
              )

          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',
                      1
                  )
              else:
                  text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'

          gradle.write_text(text)

          print("===== android/app/build.gradle.kts =====")
          print(text)
          PY
      - name: Restore google-services.json
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Enable Google Services plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          if settings.exists():
              text = settings.read_text()

              if 'id("com.google.gms.google-services")' not in text:
                  text = text.replace(
                      'plugins {',
                      'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                      1
                  )
                  settings.write_text(text)

          app_gradle = Path("android/app/build.gradle.kts")
          if app_gradle.exists():
              text = app_gradle.read_text()

              if 'id("com.google.gms.google-services")' not in text:
                  text = text.replace(
                      'plugins {',
                      'plugins {\n    id("com.google.gms.google-services")',
                      1
                  )
                  app_gradle.write_text(text)
          PY
      - name: Check pubspec assets
        run: |
          echo "===== pubspec.yaml ====="
          cat pubspec.yaml
          echo "===== Suche nach logo.jpg ====="
          grep -n "logo.jpg" pubspec.yaml || echo "OK: logo.jpg ist nicht eingetragen"
      - name: Flutter Pub get
        run: flutter pub get

      - name: Check Flutter entry point
        run: |
          echo "Repository root:"
          ls -la

          echo "lib directory:"
          ls -la lib

          if [ ! -f "lib/main.dart" ]; then
            echo "FEHLER: lib/main.dart fehlt."
            exit 1
          fi
      - name: Show actual main.dart used by build
        run: |
          echo "===== aktuelle lib/main.dart ====="
          sed -n '1,140p' lib/main.dart
          echo "===== Suche nach problematischer Kurzschreibweise ====="
          grep -nE ':\s*\.(fromSeed|center|start|end|spaceBetween|spaceAround|spaceEvenly)' lib/main.dart || true
      - name: Build APK
        run: flutter build apk --release --target=lib/main.dart --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Build App Bundle
        run: flutter build appbundle --release --target=lib/main.dart --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jf-seehausen-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: jf-seehausen-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
