name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create or repair Android project safely
        run: |
          set -e

          if [ ! -f "android/app/build.gradle.kts" ] && [ ! -f "android/app/build.gradle" ]; then
            echo "Android-Projekt ist unvollständig - wird sicher neu erzeugt."

            BACKUP_DIR="/tmp/jf_android_native_backup"
            rm -rf "$BACKUP_DIR"
            mkdir -p "$BACKUP_DIR/kotlin" "$BACKUP_DIR/res/raw" "$BACKUP_DIR/res/xml"

            MAIN_ACTIVITY="android/app/src/main/kotlin/de/jfseehausen/kyffhaeuser/MainActivity.kt"
            ALARM_SERVICE="android/app/src/main/kotlin/de/jfseehausen/kyffhaeuser/AlarmForegroundService.kt"
            FCM_SERVICE="android/app/src/main/kotlin/de/jfseehausen/kyffhaeuser/JfFirebaseMessagingService.kt"
            MANIFEST="android/app/src/main/AndroidManifest.xml"
            ALARM_SOUND="android/app/src/main/res/raw/jf_alarm.wav"
            UPDATE_FILEPATHS="android/app/src/main/res/xml/filepaths.xml"

            [ -f "$MAIN_ACTIVITY" ] && cp "$MAIN_ACTIVITY" "$BACKUP_DIR/kotlin/MainActivity.kt"
            [ -f "$ALARM_SERVICE" ] && cp "$ALARM_SERVICE" "$BACKUP_DIR/kotlin/AlarmForegroundService.kt"
            [ -f "$FCM_SERVICE" ] && cp "$FCM_SERVICE" "$BACKUP_DIR/kotlin/JfFirebaseMessagingService.kt"
            [ -f "$MANIFEST" ] && cp "$MANIFEST" "$BACKUP_DIR/AndroidManifest.xml"
            [ -f "$ALARM_SOUND" ] && cp "$ALARM_SOUND" "$BACKUP_DIR/res/raw/jf_alarm.wav"
            [ -f "$UPDATE_FILEPATHS" ] && cp "$UPDATE_FILEPATHS" "$BACKUP_DIR/res/xml/filepaths.xml"

            test -f "$BACKUP_DIR/kotlin/MainActivity.kt"
            test -f "$BACKUP_DIR/kotlin/AlarmForegroundService.kt"
            test -f "$BACKUP_DIR/kotlin/JfFirebaseMessagingService.kt"
            test -f "$BACKUP_DIR/AndroidManifest.xml"
            test -f "$BACKUP_DIR/res/raw/jf_alarm.wav"
            test -f "$BACKUP_DIR/res/xml/filepaths.xml"

            rm -rf android

            flutter create . \
              --platforms=android \
              --org de.jfseehausen \
              --project-name jf_seehausen_kyffhaeuser

            TARGET_KOTLIN="android/app/src/main/kotlin/de/jfseehausen/kyffhaeuser"
            mkdir -p "$TARGET_KOTLIN"
            mkdir -p android/app/src/main/res/raw
            mkdir -p android/app/src/main/res/xml

            cp "$BACKUP_DIR/kotlin/MainActivity.kt" "$TARGET_KOTLIN/MainActivity.kt"
            cp "$BACKUP_DIR/kotlin/AlarmForegroundService.kt" "$TARGET_KOTLIN/AlarmForegroundService.kt"
            cp "$BACKUP_DIR/kotlin/JfFirebaseMessagingService.kt" "$TARGET_KOTLIN/JfFirebaseMessagingService.kt"
            cp "$BACKUP_DIR/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml
            cp "$BACKUP_DIR/res/raw/jf_alarm.wav" android/app/src/main/res/raw/jf_alarm.wav
            cp "$BACKUP_DIR/res/xml/filepaths.xml" android/app/src/main/res/xml/filepaths.xml
          fi

          test -f android/app/build.gradle.kts || test -f android/app/build.gradle

      - name: Set Android package name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          package_name = "de.jfseehausen.kyffhaeuser"

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              text = kts.read_text()
              text = re.sub(
                  r'namespace\s*=\s*"[^"]+"',
                  f'namespace = "{package_name}"',
                  text,
              )
              text = re.sub(
                  r'applicationId\s*=\s*"[^"]+"',
                  f'applicationId = "{package_name}"',
                  text,
              )
              kts.write_text(text)
          elif groovy.exists():
              text = groovy.read_text()
              text = re.sub(
                  r'namespace\s+["\'][^"\']+["\']',
                  f'namespace "{package_name}"',
                  text,
              )
              text = re.sub(
                  r'applicationId\s+["\'][^"\']+["\']',
                  f'applicationId "{package_name}"',
                  text,
              )
              groovy.write_text(text)
          else:
              raise SystemExit("Keine Android-App-Gradle-Datei gefunden")
          PY

      - name: Verify native alarm integration
        run: |
          set -e
          test -f android/app/src/main/kotlin/de/jfseehausen/kyffhaeuser/MainActivity.kt
          test -f android/app/src/main/kotlin/de/jfseehausen/kyffhaeuser/AlarmForegroundService.kt
          test -f android/app/src/main/kotlin/de/jfseehausen/kyffhaeuser/JfFirebaseMessagingService.kt
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/raw/jf_alarm.wav
          test -f android/app/src/main/res/xml/filepaths.xml

          grep -q 'AlarmForegroundService' android/app/src/main/AndroidManifest.xml
          grep -q 'JfFirebaseMessagingService' android/app/src/main/AndroidManifest.xml
          grep -q 'OtaUpdateFileProvider' android/app/src/main/AndroidManifest.xml
          if grep -Fq '```' android/app/src/main/AndroidManifest.xml; then
            echo "FEHLER: Markdown-Codeblock im AndroidManifest gefunden."
            exit 1
          fi

      - name: Restore google-services.json
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Restore persistent Android signing key
        run: |
          set -e
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/jf-release.jks
          test -s android/app/jf-release.jks
          keytool -list \
            -keystore android/app/jf-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Configure persistent release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              text = kts.read_text()

              if 'create("release")' not in text:
                  signing = (
                      '\n    signingConfigs {\n'
                      '        create("release") {\n'
                      '            storeFile = file("jf-release.jks")\n'
                      '            storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
                      '            keyAlias = System.getenv("ANDROID_KEY_ALIAS")\n'
                      '            keyPassword = System.getenv("ANDROID_KEY_PASSWORD")\n'
                      '        }\n'
                      '    }\n'
                  )
                  text = text.replace("android {", "android {" + signing, 1)

              text = re.sub(
                  r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                  'signingConfig = signingConfigs.getByName("release")',
                  text,
              )

              release_pattern = r'(buildTypes\s*\{\s*release\s*\{)'
              if (
                  'signingConfig = signingConfigs.getByName("release")'
                  not in text
              ):
                  text, count = re.subn(
                      release_pattern,
                      r'\1\n            signingConfig = signingConfigs.getByName("release")',
                      text,
                      count=1,
                      flags=re.S,
                  )
                  if count != 1:
                      raise SystemExit(
                          "Release-Buildtyp in build.gradle.kts nicht gefunden."
                      )

              kts.write_text(text)

          elif groovy.exists():
              text = groovy.read_text()

              if "signingConfigs {" not in text or "jf-release.jks" not in text:
                  signing = (
                      "\n    signingConfigs {\n"
                      "        release {\n"
                      "            storeFile file('jf-release.jks')\n"
                      "            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')\n"
                      "            keyAlias System.getenv('ANDROID_KEY_ALIAS')\n"
                      "            keyPassword System.getenv('ANDROID_KEY_PASSWORD')\n"
                      "        }\n"
                      "    }\n"
                  )
                  text = text.replace("android {", "android {" + signing, 1)

              text = re.sub(
                  r'signingConfig\s+signingConfigs\.debug',
                  'signingConfig signingConfigs.release',
                  text,
              )

              if "signingConfig signingConfigs.release" not in text:
                  text, count = re.subn(
                      r'(buildTypes\s*\{\s*release\s*\{)',
                      r'\1\n            signingConfig signingConfigs.release',
                      text,
                      count=1,
                      flags=re.S,
                  )
                  if count != 1:
                      raise SystemExit(
                          "Release-Buildtyp in build.gradle nicht gefunden."
                      )

              groovy.write_text(text)
          else:
              raise SystemExit("Keine Android-App-Gradle-Datei gefunden")

          print("Dauerhafter Release-Signierschlüssel ist konfiguriert.")
          PY

      - name: Configure Firebase, desugaring and Latin ML Kit release dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings_kts = Path("android/settings.gradle.kts")
          settings_groovy = Path("android/settings.gradle")
          app_kts = Path("android/app/build.gradle.kts")
          app_groovy = Path("android/app/build.gradle")

          if settings_kts.exists():
              text = settings_kts.read_text()
              if 'id("com.google.gms.google-services")' not in text:
                  text = text.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services") version "4.5.0" apply false',
                      1,
                  )
              settings_kts.write_text(text)
          elif settings_groovy.exists():
              text = settings_groovy.read_text()
              if "com.google.gms.google-services" not in text:
                  text = text.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services' version '4.5.0' apply false",
                      1,
                  )
              settings_groovy.write_text(text)

          if app_kts.exists():
              text = app_kts.read_text()

              if 'id("com.google.gms.google-services")' not in text:
                  text = text.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services")',
                      1,
                  )

              if "isCoreLibraryDesugaringEnabled = true" not in text:
                  if re.search(r'compileOptions\s*\{', text):
                      text = re.sub(
                          r'compileOptions\s*\{',
                          'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                          text,
                          count=1,
                      )
                  else:
                      text = text.replace(
                          "android {",
                          'android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }\n',
                          1,
                      )

              deps = [
                  'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',
                  'implementation(platform("com.google.firebase:firebase-bom:34.19.0"))',
                  'implementation("com.google.firebase:firebase-messaging")',
              ]

              missing = [d for d in deps if d not in text]
              if missing:
                  block = "\n".join(f"    {d}" for d in missing)
                  if "dependencies {" in text:
                      text = text.replace(
                          "dependencies {",
                          "dependencies {\n" + block,
                          1,
                      )
                  else:
                      text += "\n\ndependencies {\n" + block + "\n}\n"

              app_kts.write_text(text)

          elif app_groovy.exists():
              text = app_groovy.read_text()

              if "com.google.gms.google-services" not in text:
                  text = text.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services'",
                      1,
                  )

              if "coreLibraryDesugaringEnabled true" not in text:
                  if re.search(r'compileOptions\s*\{', text):
                      text = re.sub(
                          r'compileOptions\s*\{',
                          'compileOptions {\n        coreLibraryDesugaringEnabled true',
                          text,
                          count=1,
                      )
                  else:
                      text = text.replace(
                          "android {",
                          'android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }\n',
                          1,
                      )

              deps = [
                  "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'",
                  'implementation platform("com.google.firebase:firebase-bom:34.19.0")',
                  'implementation "com.google.firebase:firebase-messaging"',
              ]

              missing = [d for d in deps if d not in text]
              if missing:
                  block = "\n".join(f"    {d}" for d in missing)
                  if "dependencies {" in text:
                      text = text.replace(
                          "dependencies {",
                          "dependencies {\n" + block,
                          1,
                      )
                  else:
                      text += "\n\ndependencies {\n" + block + "\n}\n"

              app_groovy.write_text(text)
          else:
              raise SystemExit("Keine Android-App-Gradle-Datei gefunden")

          print("Latin-Text-Erkennung aktiv; zusätzliche ML-Kit-Sprachpakete entfernt.")
          PY

      - name: Configure R8 for optional ML Kit scripts
        run: |
          set -e

          cat > android/app/proguard-rules.pro <<'RULES'
          # The app uses TextRecognitionScript.latin only.
          # These optional language modules are intentionally not bundled.
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          RULES

          python3 - <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              text = kts.read_text()
              pattern = r'(buildTypes\s*\{\s*release\s*\{)'
              additions = []
              if "isMinifyEnabled = true" not in text:
                  additions.append("            isMinifyEnabled = true")
              if "isShrinkResources = true" not in text:
                  additions.append("            isShrinkResources = true")
              if 'proguardFiles("proguard-rules.pro")' not in text:
                  additions.append('            proguardFiles("proguard-rules.pro")')

              if additions:
                  replacement = r'\1\n' + "\n".join(additions)
                  text, count = re.subn(
                      pattern,
                      replacement,
                      text,
                      count=1,
                      flags=re.S,
                  )
                  if count != 1:
                      raise SystemExit(
                          "Konnte release-Buildtyp in build.gradle.kts "
                          "nicht für R8 konfigurieren."
                      )
              kts.write_text(text)

          elif groovy.exists():
              text = groovy.read_text()
              pattern = r'(buildTypes\s*\{\s*release\s*\{)'
              additions = []
              if "minifyEnabled true" not in text:
                  additions.append("            minifyEnabled true")
              if "shrinkResources true" not in text:
                  additions.append("            shrinkResources true")
              if "proguardFiles 'proguard-rules.pro'" not in text:
                  additions.append("            proguardFiles 'proguard-rules.pro'")

              if additions:
                  replacement = r'\1\n' + "\n".join(additions)
                  text, count = re.subn(
                      pattern,
                      replacement,
                      text,
                      count=1,
                      flags=re.S,
                  )
                  if count != 1:
                      raise SystemExit(
                          "Konnte release-Buildtyp in build.gradle "
                          "nicht für R8 konfigurieren."
                      )
              groovy.write_text(text)

          else:
              raise SystemExit("Keine Android-App-Gradle-Datei gefunden")

          print("R8, Code-Minifizierung und Resource-Shrinking für Release aktiviert.")
          PY

          test -f android/app/proguard-rules.pro
          grep -q 'text.chinese' android/app/proguard-rules.pro
          grep -q 'text.korean' android/app/proguard-rules.pro

      - name: Flutter clean
        run: flutter clean

      - name: Flutter Pub get
        run: flutter pub get
       
      - name: Optimize home images for Android package
        run: |
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image

          files = [
              "assets/home/jugendfeuerwehr_am_hafen_bei_sonnenuntergang.png",
              "assets/home/jugendfeuerwehr_am_hafen_im_sonnenuntergang.png",
              "assets/home/jugendfeuerwehr_plant_den_naechsten_einsatz.png",
              "assets/home/jugendfeuerwehr_im_goldenen_abendlicht.png",
              "assets/home/jugendfeuerwehr_am_goldenen_hafen.png",
              "assets/home/feuerwehrteam_im_sonnenuntergang_am_hafen.png",
              "assets/home/feuerwehrjugend_am_hafen_im_sonnenuntergang.png",
              "assets/home/jugendfeuerwehr_am_goldenen_meereshorizont.png",
          ]

          total = 0
          for filename in files:
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f"Missing home image: {filename}")

              image = Image.open(path).convert("RGB")
              max_dimension = 768
              if max(image.size) > max_dimension:
                  scale = max_dimension / max(image.size)
                  image = image.resize(
                      (round(image.width * scale), round(image.height * scale)),
                      Image.Resampling.LANCZOS,
                  )

              image = image.quantize(
                  colors=128,
                  method=Image.Quantize.MEDIANCUT,
                  dither=Image.Dither.FLOYDSTEINBERG,
              )
              image.save(path, format="PNG", optimize=True)
              size = path.stat().st_size
              total += size
              print(f"{filename}: {size} bytes")

          print(f"Optimized Android home assets total: {total} bytes")
          if total > 2 * 1024 * 1024:
              raise SystemExit("Optimized home assets are unexpectedly larger than 2 MiB.")
          PY

      - name: Optimize branding images for Android package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          # Only optimize the temporary GitHub Actions checkout.
          # Repository source files remain unchanged.
          settings = {
              "assets/branding/logo.png": 1024,
              "assets/branding/header_logo.png": 768,
              "assets/branding/splash_logo.png": 768,
              "assets/branding/app_icon.png": 768,
          }

          before_total = 0
          after_total = 0

          for filename, max_dimension in settings.items():
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f"Missing branding image: {filename}")

              before = path.stat().st_size
              before_total += before

              with Image.open(path) as source:
                  image = source.convert("RGBA")

                  if max(image.size) > max_dimension:
                      scale = max_dimension / max(image.size)
                      image = image.resize(
                          (round(image.width * scale), round(image.height * scale)),
                          Image.Resampling.LANCZOS,
                      )

                  image.save(
                      path,
                      format="PNG",
                      optimize=True,
                      compress_level=9,
                  )

              after = path.stat().st_size
              after_total += after
              print(f"{filename}: {before} -> {after} bytes")

          saved = before_total - after_total
          print(f"Branding total: {before_total} -> {after_total} bytes")
          print(f"Saved: {saved} bytes")

          if saved <= 0:
              raise SystemExit("Branding optimization did not reduce package assets.")
          PY

      - name: Verify branding assets
        run: |
          test -f assets/branding/logo.png
          test -f assets/branding/header_logo.png
          test -f assets/branding/splash_logo.png
          test -f assets/branding/app_icon.png

      - name: Generate Android app icons
        run: |
          cat > /tmp/flutter_launcher_icons_android.yaml <<'YAML'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: assets/branding/app_icon.png
            adaptive_icon_background: "#0A1F44"
            adaptive_icon_foreground: assets/branding/app_icon.png
          YAML

          dart run flutter_launcher_icons -f /tmp/flutter_launcher_icons_android.yaml

      - name: Generate Android splash screen
        run: |
          cat > /tmp/flutter_native_splash_android.yaml <<'YAML'
          flutter_native_splash:
            color: "#0A1F44"
            image: assets/branding/splash_logo.png
            android: true
            ios: false

            android_12:
              color: "#0A1F44"
              image: assets/branding/splash_logo.png
          YAML

          dart run flutter_native_splash:create --path=/tmp/flutter_native_splash_android.yaml

      - name: Build small ABI-specific APKs
        run: >
          flutter build apk
          --release
          --split-per-abi
          --target=lib/main.dart
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Verify Free-plan APK sizes
        run: |
          set -e
          MAX_BYTES=$((50 * 1024 * 1024))

          for APK in \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          do
            test -f "$APK"
            SIZE=$(stat -c%s "$APK")
            echo "$APK: $SIZE bytes"
            if [ "$SIZE" -gt "$MAX_BYTES" ]; then
              echo "FEHLER: $APK ist größer als 50 MiB und passt nicht in Supabase Free."
              exit 1
            fi
          done

      - name: Build App Bundle
        run: >
          flutter build appbundle
          --release
          --target=lib/main.dart
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Verify build outputs
        run: |
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -f build/app/outputs/flutter-apk/app-x86_64-release.apk
          test -f build/app/outputs/bundle/release/app-release.aab

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: jf-seehausen-apk-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: jf-seehausen-apk-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: jf-seehausen-apk-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: jf-seehausen-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
