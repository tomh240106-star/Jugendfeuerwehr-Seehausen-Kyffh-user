name: Push Test And Clean Logout

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch push services and UI robustly
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          native = Path("lib/services/push_service_native.dart")
          web = Path("lib/services/push_service_web.dart")
          home = Path("lib/screens/home_shell.dart")

          native_text = native.read_text(encoding="utf-8")
          web_text = web.read_text(encoding="utf-8")
          home_text = home.read_text(encoding="utf-8")

          native_methods = '''  static Future<void> unregisterCurrentDevice() async {
            try {
              final token = await _messaging.getToken();
              if (token == null || token.isEmpty) return;

              await Supabase.instance.client.rpc(
                'release_device_token',
                params: {'p_token': token},
              );
            } catch (error) {
              debugPrint(
                'Geräte-Token konnte beim Abmelden nicht entfernt werden: $error',
              );
            }
          }

          static Future<bool> sendTestNotification() async {
            try {
              final response = await Supabase.instance.client.functions.invoke(
                'send-push',
                body: {
                  'title': 'Jugendfeuerwehr Test',
                  'body': 'Benachrichtigungen funktionieren auf diesem Gerät.',
                  'self_test': true,
                },
              );

              if (response.status >= 400) return false;

              final data = response.data;
              if (data is Map) {
                final sent = data['sent'];
                if (sent is num) return sent > 0;
              }

              return true;
            } catch (error) {
              debugPrint('Test-Benachrichtigung fehlgeschlagen: $error');
              return false;
            }
          }

          '''

          web_methods = '''  static Future<void> unregisterCurrentDevice() async {
            try {
              final token =
                  (await _getWebPushToken().toDart).toDart.trim();
              if (token.isEmpty) return;

              await Supabase.instance.client.rpc(
                'release_device_token',
                params: {'p_token': token},
              );
            } catch (_) {}
          }

          static Future<bool> sendTestNotification() async {
            try {
              final response = await Supabase.instance.client.functions.invoke(
                'send-push',
                body: {
                  'title': 'Jugendfeuerwehr Test',
                  'body': 'Benachrichtigungen funktionieren auf diesem Gerät.',
                  'self_test': true,
                },
              );

              if (response.status >= 400) return false;

              final data = response.data;
              if (data is Map) {
                final sent = data['sent'];
                if (sent is num) return sent > 0;
              }

              return true;
            } catch (_) {
              return false;
            }
          }

          '''

          def insert_before_cancel(text, methods, name):
              if "static Future<void> unregisterCurrentDevice()" in text:
                  return text

              marker = "  static Future<void> cancelAlarmNotification("
              idx = text.find(marker)
              if idx == -1:
                  raise SystemExit(f"{name}: cancelAlarmNotification nicht gefunden.")

              return text[:idx] + methods + text[idx:]

          native_text = insert_before_cancel(
              native_text, native_methods, "Native PushService"
          )
          web_text = insert_before_cancel(
              web_text, web_methods, "Web PushService"
          )

          top_signout = "await Supabase.instance.client.auth.signOut();"
          more_signout = "await _supabase.auth.signOut();"

          if "PushService.unregisterCurrentDevice();" not in home_text:
              if top_signout not in home_text:
                  raise SystemExit("Oberer Logout wurde nicht gefunden.")
              home_text = home_text.replace(
                  top_signout,
                  "await PushService.unregisterCurrentDevice();\n"
                  "                            " + top_signout,
                  1,
              )

              if more_signout not in home_text:
                  raise SystemExit("Logout im Mehr-Bereich wurde nicht gefunden.")
              home_text = home_text.replace(
                  more_signout,
                  "await PushService.unregisterCurrentDevice();\n"
                  "                        " + more_signout,
                  1,
              )

          if "Test-Benachrichtigung senden" not in home_text:
              label_marker = "label: const Text('Profil speichern')"
              label_idx = home_text.find(label_marker)
              if label_idx == -1:
                  raise SystemExit("Profil-speichern-Button wurde nicht gefunden.")

              insert_idx = home_text.rfind(
                  "                const SizedBox(height: 18),",
                  0,
                  label_idx,
              )
              if insert_idx == -1:
                  raise SystemExit(
                      "Einfügestelle vor Profil-speichern wurde nicht gefunden."
                  )

              test_button = '''                const SizedBox(height: 10),
                OutlinedButton.icon(
                  onPressed: () async {
                    final sent = await PushService.sendTestNotification();

                    if (!context.mounted) return;

                    ScaffoldMessenger.of(context).showSnackBar(
                      SnackBar(
                        content: Text(
                          sent
                              ? 'Test-Benachrichtigung wurde gesendet.'
                              : 'Test-Benachrichtigung konnte nicht gesendet werden. Bitte Benachrichtigungen auf diesem Gerät zuerst aktivieren.',
                        ),
                      ),
                    );
                  },
                  icon: const Icon(Icons.send_outlined),
                  label: const Text('Test-Benachrichtigung senden'),
                ),
'''
              home_text = (
                  home_text[:insert_idx]
                  + test_button
                  + home_text[insert_idx:]
              )

          native.write_text(native_text, encoding="utf-8")
          web.write_text(web_text, encoding="utf-8")
          home.write_text(home_text, encoding="utf-8")

          print("Push-Test und sauberer Geräte-Logout wurden eingebaut.")
          PY

      - name: Format
        run: dart format lib/services/push_service_native.dart lib/services/push_service_web.dart lib/screens/home_shell.dart

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Build web
        run: >
          flutter build web
          --release
          --base-href "/Jugendfeuerwehr-Seehausen-Kyffh-user/"
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Verify
        run: |
          set -e
          grep -q "unregisterCurrentDevice" lib/services/push_service_native.dart
          grep -q "unregisterCurrentDevice" lib/services/push_service_web.dart
          grep -q "sendTestNotification" lib/services/push_service_native.dart
          grep -q "sendTestNotification" lib/services/push_service_web.dart
          grep -q "Test-Benachrichtigung senden" lib/screens/home_shell.dart
          test "$(grep -c "PushService.unregisterCurrentDevice" lib/screens/home_shell.dart)" -ge 2

      - name: Commit
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             lib/services/push_service_native.dart             lib/services/push_service_web.dart             lib/screens/home_shell.dart

          if git diff --cached --quiet; then
            echo "Änderungen bereits vorhanden."
            exit 0
          fi

          git commit -m "Add push test and clean device logout"
          git push origin main

      - name: Summary
        run: |
          echo "### Push-Verwaltung verbessert" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- aktueller Geräte-Token wird beim Abmelden entfernt" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test-Benachrichtigung im Profil hinzugefügt" >> "$GITHUB_STEP_SUMMARY"
          echo "- funktioniert für Android und Web" >> "$GITHUB_STEP_SUMMARY"
