name: Auto Import Dienstplan V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reuse Dienstplan import patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re
          import subprocess

          workflow = Path(".github/workflows/auto-import-dienstplan.yml")
          text = workflow.read_text(encoding="utf-8")

          match = re.search(
              r'echo "([A-Za-z0-9+/=]+)" \| base64 --decode > /tmp/patch\.py',
              text,
          )
          if not match:
              raise SystemExit("Dienstplan patch payload not found")

          patch = base64.b64decode(match.group(1))
          Path("/tmp/patch.py").write_bytes(patch)

          subprocess.run(["python3", "/tmp/patch.py"], check=True)
          PY

      - name: Keep iOS workflow unchanged
        run: |
          git restore .github/workflows/ios-build.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Format
        run: dart format lib

      - name: Analyze
        run: flutter analyze lib

      - name: Commit
        shell: bash
        run: |
          git restore .github/workflows/ios-build.yml

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lib pubspec.yaml pubspec.lock
          git commit -m "Auto import Dienstplan into training plans"
          git push origin main
