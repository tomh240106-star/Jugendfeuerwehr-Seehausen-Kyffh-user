name: Auto Import Dienstplan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add Dienstplan OCR import
        shell: bash
        run: |
          echo "" | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Format
        run: dart format lib

      - name: Analyze
        run: flutter analyze lib

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib pubspec.yaml pubspec.lock .github/workflows/ios-build.yml
          git commit -m "Auto import Dienstplan into training plans"
          git push origin main
