name: Add Web Alarm Sound

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-alarm-sound:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add web alarm sound file
        run: |
          test -f android/app/src/main/res/raw/jf_alarm.wav
          cp android/app/src/main/res/raw/jf_alarm.wav web/jf_alarm.wav

      - name: Replace web alarm service worker
        env:
          SW_B64: ""
        run: |
          echo "$SW_B64" | base64 --decode > web/firebase-messaging-sw.js

      - name: Replace web alarm native bridge
        env:
          SVC_B64: ""
        run: |
          echo "$SVC_B64" | base64 --decode > lib/services/alarm_native_service_web.dart

      - name: Patch web page alarm audio
        env:
          AUDIO_B64: ""
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("web/index.html")
          text = path.read_text(encoding="utf-8")
          audio_block = base64.b64decode(os.environ["AUDIO_B64"]).decode("utf-8")

          marker = "    let jfPushRegistrationPromise = null;\n"
          if "window.jfWebAlarmStart = function" not in text:
              if marker not in text:
                  raise SystemExit("Audio-Einfügestelle in web/index.html nicht gefunden.")
              text = text.replace(marker, marker + audio_block, 1)

          old_request = '''    window.jfWebPushRequestToken = async function () {
              if (!("Notification" in window)) return "";

              const permission = await Notification.requestPermission();
          '''
          new_request = '''    window.jfWebPushRequestToken = async function () {
              if (!("Notification" in window)) return "";

              window.jfWebAlarmPrime();

              const permission = await Notification.requestPermission();
          '''
          if old_request in text:
              text = text.replace(old_request, new_request, 1)

          old_handler = '''    jfMessaging.onMessage((payload) => {
              const data = payload?.data || {};
              if ((data.source || "") !== "jf_alarm") return;
          '''
          new_handler = '''    jfMessaging.onMessage((payload) => {
              const data = payload?.data || {};
              const source = data.source || "";

              if (source === "jf_alarm_cancel") {
                window.jfWebAlarmStop();
                return;
              }

              if (source !== "jf_alarm") return;

              window.jfWebAlarmStart(
                data.alarm_id || "active",
                data.title || "JUGENDFEUERWEHR-ALARM",
                data.body || "Alarm öffnen und Rückmeldung geben."
              );
          '''
          if old_handler in text:
              text = text.replace(old_handler, new_handler, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Flutter pub get
        run: flutter pub get

      - name: Format
        run: dart format lib/services/alarm_native_service_web.dart

      - name: Analyze
        run: flutter analyze lib

      - name: Build web
        run: >
          flutter build web
          --release
          --base-href "/Jugendfeuerwehr-Seehausen-Kyffh-user/"
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Verify web alarm sound
        run: |
          test -f build/web/jf_alarm.wav
          grep -q "jfWebAlarmStart" build/web/index.html
          grep -q "jfWebAlarmStop" build/web/index.html
          grep -q "jf_alarm_cancel" build/web/firebase-messaging-sw.js
          grep -q "jf_alarm_start" build/web/firebase-messaging-sw.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             web/jf_alarm.wav             web/firebase-messaging-sw.js             web/index.html             lib/services/alarm_native_service_web.dart

          if git diff --cached --quiet; then
            echo "Web-Alarmton bereits eingebaut."
            exit 0
          fi

          git commit -m "Add persistent web alarm sound"
          git push origin main

      - name: Summary
        run: |
          echo "### Web-Alarmton eingebaut" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- verwendet den vorhandenen Jugendfeuerwehr-Alarmton" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ton startet bei eingehendem Web-Alarm, wenn Browser-Audio freigegeben ist" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ton läuft in Schleife" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ton stoppt nach Rückmeldung" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ton stoppt bei Alarmende durch den Ausbilder" >> "$GITHUB_STEP_SUMMARY"
